<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="The Tallow Deep — a first-person gothic horror roguelike RPG. Descend beneath Saint Aldric's Hospice with only a lantern, your wits, and whatever the dead left behind.">
<meta name="theme-color" content="#050403">
<meta name="color-scheme" content="dark">
<title>The Tallow Deep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23070504'/%3E%3Cpath d='M32 8c6 9 9 14 9 20a9 9 0 0 1-18 0c0-6 3-11 9-20z' fill='%23e8a33c'/%3E%3Cpath d='M32 18c3 5 4 8 4 11a4 4 0 0 1-8 0c0-3 1-6 4-11z' fill='%23fff1c4'/%3E%3Crect x='25' y='38' width='14' height='20' rx='2' fill='%23d9ccb2'/%3E%3C/svg%3E">
<style>
:root{
  --bone:#d9cdb5;--bone-dim:#9c917d;--bone-faint:#6b6255;
  --gold:#caa15a;--gold-hi:#f0cf8a;--gold-dim:#7a5f30;
  --blood:#8f1d1d;--blood-hi:#cf3131;--sanity:#8497c9;--sanity-hi:#b8c6ee;
  --oil:#e0a43e;--stam:#bdb3a0;--xp:#b8943f;
  --ink:#070605;--panel:rgba(13,10,8,.94);--panel2:rgba(22,17,13,.96);--line:rgba(202,161,90,.26);--line-hi:rgba(202,161,90,.6);
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',Georgia,'Times New Roman',serif;
  --display:'Trajan Pro','Cinzel','Cormorant SC','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --mono:'Consolas','DejaVu Sans Mono','Menlo',monospace;
  --ui-scale:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--bone);font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body.hide-cursor{cursor:none}
button{font-family:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none}
.hidden{display:none!important}
.dim{color:var(--bone-dim)}
.gold{color:var(--gold)}
.blood{color:var(--blood-hi)}
.san{color:var(--sanity)}
.small{font-size:.82em}
kbd,.kbd{display:inline-block;min-width:1.6em;padding:.05em .4em;margin:0 .1em;border:1px solid var(--line-hi);border-bottom-width:2px;border-radius:3px;font-family:var(--mono);font-size:.78em;line-height:1.35;color:var(--gold-hi);background:rgba(0,0,0,.45);text-align:center;vertical-align:.08em}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:30;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.screen.on{display:flex;animation:scrIn .45s ease both}
.screen.backdrop{background:radial-gradient(ellipse at center,rgba(12,9,7,.78) 0%,rgba(0,0,0,.94) 75%)}
.screen.solid{background:#000}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 0 0 1px rgba(0,0,0,.9),0 20px 60px rgba(0,0,0,.85),inset 0 0 60px rgba(0,0,0,.6);padding:26px 30px;max-width:min(980px,96vw);max-height:92vh;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
.panel::before,.panel::after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--line-hi);pointer-events:none}
.panel::before{left:5px;top:5px;border-right:none;border-bottom:none}
.panel::after{right:5px;bottom:5px;border-left:none;border-top:none}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:var(--gold-dim)}
h1,h2,h3{font-family:var(--display);font-weight:normal;letter-spacing:.14em;margin:0 0 .5em;color:var(--bone)}
h2{font-size:1.5em;text-transform:uppercase}
h3{font-size:1.05em;text-transform:uppercase;color:var(--gold);letter-spacing:.18em}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line-hi),transparent);margin:14px 0;border:0}
p{line-height:1.55}

/* ---------- buttons ---------- */
.menu{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:10px}
.btn{position:relative;background:none;border:none;padding:9px 30px;font-size:1.12em;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);cursor:pointer;font-family:var(--display);transition:color .18s,letter-spacing .25s,text-shadow .25s;outline:none;white-space:nowrap}
.btn::before,.btn::after{content:'';position:absolute;top:50%;width:6px;height:6px;border:1px solid var(--gold);transform:translateY(-50%) rotate(45deg) scale(0);transition:transform .2s}
.btn::before{left:8px}.btn::after{right:8px}
.btn:hover,.btn.focus,.btn:focus-visible{color:var(--gold-hi);letter-spacing:.26em;text-shadow:0 0 14px rgba(240,190,100,.45)}
.btn:hover::before,.btn:hover::after,.btn.focus::before,.btn.focus::after,.btn:focus-visible::before,.btn:focus-visible::after{transform:translateY(-50%) rotate(45deg) scale(1)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sm{font-size:.86em;padding:6px 18px}
.btn.box{border:1px solid var(--line);background:rgba(0,0,0,.35);padding:8px 18px;font-size:.84em}
.btn.box:hover,.btn.box.focus{border-color:var(--line-hi);background:rgba(202,161,90,.08)}
.btn.box::before,.btn.box::after{display:none}
.btn.danger:hover,.btn.danger.focus{color:var(--blood-hi);text-shadow:0 0 14px rgba(200,40,40,.5)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.spacer{flex:1}

/* ---------- loading ---------- */
#scr-loading .lt{font-family:var(--display);letter-spacing:.5em;font-size:.9em;color:var(--bone-dim);text-transform:uppercase}
#load-bar{width:min(340px,70vw);height:2px;background:rgba(255,255,255,.07);margin:18px auto 10px;overflow:hidden}
#load-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold-hi));box-shadow:0 0 12px var(--gold);transition:width .15s}
#load-msg{font-style:italic;color:var(--bone-faint);font-size:.9em;min-height:1.3em}
.candle-ico{width:18px;height:40px;margin:0 auto 18px;position:relative}
.candle-ico i{position:absolute;left:50%;bottom:0;width:10px;height:22px;margin-left:-5px;background:linear-gradient(90deg,#b9ab8f,#efe4c8 45%,#a89878);border-radius:2px 2px 1px 1px}
.candle-ico b{position:absolute;left:50%;bottom:21px;width:8px;height:15px;margin-left:-4px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(ellipse at 50% 70%,#fff8d8 0%,#ffcf6b 35%,rgba(240,120,20,.8) 70%,transparent 72%);filter:drop-shadow(0 0 8px #f7a53a);animation:flick 1.6s infinite alternate ease-in-out;transform-origin:50% 100%}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}25%{transform:scale(.92,1.08) rotate(2deg)}50%{transform:scale(1.04,.95) rotate(-1deg)}75%{transform:scale(.96,1.1) rotate(3deg)}100%{transform:scale(1,.98) rotate(0)}}

/* ---------- title ---------- */
#scr-title{justify-content:space-between;padding-top:max(16px,10vh);padding-bottom:max(38px,6vh);background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.35) 65%,rgba(0,0,0,.85) 100%)}
.logo{position:relative;width:100%;text-align:center;pointer-events:none}
.title-low{display:flex;flex-direction:column;align-items:center}
.logo .pre{font-family:var(--display);letter-spacing:.8em;font-size:clamp(11px,1.3vw,15px);color:var(--bone-dim);text-transform:uppercase;margin-bottom:.6em;padding-left:.8em}
.logo .name{font-family:var(--display);font-size:clamp(40px,8.2vw,118px);letter-spacing:.16em;line-height:1;color:#e9dcc0;text-transform:uppercase;padding-left:.16em;text-shadow:0 0 18px rgba(255,170,80,.35),0 0 60px rgba(255,120,40,.18),0 4px 0 rgba(0,0,0,.6);animation:logoFlick 7s infinite}
.logo .sub{margin-top:.9em;font-style:italic;color:var(--bone-dim);font-size:clamp(13px,1.35vw,18px);letter-spacing:.06em}
@keyframes logoFlick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.72}43%{opacity:1}44%{opacity:.84}45%{opacity:1}78%{opacity:1}79%{opacity:.9}80%{opacity:1}}
#title-menu .btn{font-size:1.05em}
.title-foot{position:absolute;bottom:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:.72em;color:var(--bone-faint);letter-spacing:.1em;pointer-events:none}
#press-any{position:absolute;bottom:22vh;left:0;right:0;text-align:center;font-family:var(--display);letter-spacing:.45em;color:var(--bone-dim);font-size:.95em;animation:pulse 2.4s infinite ease-in-out;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
.meta-strip{display:flex;gap:26px;justify-content:center;margin-top:18px;font-size:.8em;color:var(--bone-faint);letter-spacing:.12em;text-transform:uppercase}
.meta-strip b{color:var(--gold);font-weight:normal}
@media (max-height:720px){#title-menu .btn{padding:6px 30px;font-size:.98em}.logo .name{font-size:clamp(34px,min(8.2vw,13vh),118px)}.meta-strip{margin-top:10px}}
@media (max-width:520px){.meta-strip{flex-wrap:wrap;gap:4px 14px;font-size:.68em;padding:0 10px}.title-foot{font-size:.6em}}
@media (max-height:580px){#scr-title{padding-top:12px}#title-menu .btn{padding:3px 24px;font-size:.9em}.logo .pre,.logo .sub{display:none}.meta-strip{display:none}}

/* ---------- class select ---------- */
.class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:12px 0 6px}
.ccard{position:relative;border:1px solid var(--line);background:rgba(0,0,0,.42);padding:16px 16px 14px;cursor:pointer;transition:border-color .2s,background .2s,transform .2s;min-height:240px;display:flex;flex-direction:column}
.ccard:hover,.ccard.focus{border-color:var(--line-hi);background:rgba(202,161,90,.06);transform:translateY(-2px)}
.ccard.sel{border-color:var(--gold);background:rgba(202,161,90,.1);box-shadow:0 0 24px rgba(202,161,90,.15) inset}
.ccard.locked{opacity:.5;cursor:default}
.ccard .cname{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:1.05em;color:var(--bone)}
.ccard .ctag{font-style:italic;color:var(--bone-dim);font-size:.85em;margin:3px 0 10px}
.ccard .cdesc{font-size:.84em;line-height:1.45;color:var(--bone-dim);flex:1}
.ccard .cstats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:.78em;margin-top:10px;color:var(--bone-dim)}
.ccard .cstats b{color:var(--bone);font-weight:normal;float:right}
.ccard .ckit{font-size:.76em;color:var(--gold);margin-top:8px;letter-spacing:.04em}
.ccard.locked>*:not(.lock){visibility:hidden}
.ccard.locked{opacity:.8}
.ccard .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:repeating-linear-gradient(135deg,rgba(0,0,0,.72) 0 10px,rgba(20,14,10,.72) 10px 20px);visibility:visible!important;font-size:.85em;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-dim);text-align:center;padding:10px}
.diff-row{display:flex;gap:8px;justify-content:center;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{background:none;border:none;padding:6px 14px;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-dim);cursor:pointer;font-family:var(--display)}
.seg button.on{background:rgba(202,161,90,.16);color:var(--gold-hi)}
.seg button:hover{color:var(--bone)}

/* ---------- settings ---------- */
.set-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--bone-dim);font-family:var(--display);letter-spacing:.16em;text-transform:uppercase;font-size:.82em;margin-bottom:-1px}
.tab.on{color:var(--gold-hi);border-bottom-color:var(--gold)}
.tab:hover{color:var(--bone)}
.set-list{display:grid;grid-template-columns:minmax(160px,1fr) minmax(200px,1.3fr);gap:8px 22px;align-items:center;min-width:min(620px,86vw)}
.set-list label{font-size:.92em;color:var(--bone)}
.set-list .hint{grid-column:1/-1;font-size:.76em;color:var(--bone-faint);margin-top:-6px;font-style:italic}
.set-ctl{display:flex;align-items:center;gap:10px}
.set-ctl output{min-width:3.4em;text-align:right;font-family:var(--mono);font-size:.8em;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--gold-dim),rgba(255,255,255,.12))}
input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;transform:rotate(45deg);background:var(--gold);border:1px solid #000}
input[type=range]::-moz-range-thumb{width:10px;height:10px;transform:rotate(45deg);background:var(--gold);border:1px solid #000;border-radius:0}
.tog{position:relative;width:44px;height:20px;border:1px solid var(--line-hi);background:rgba(0,0,0,.5);cursor:pointer;flex:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:12px;height:12px;background:var(--bone-faint);transition:left .15s,background .15s;transform:rotate(45deg) scale(.8)}
.tog.on{background:rgba(202,161,90,.18)}
.tog.on::after{left:27px;background:var(--gold-hi)}
select{background:#0c0907;color:var(--bone);border:1px solid var(--line-hi);padding:4px 8px;font-family:var(--serif);font-size:.9em}
.bind{min-width:120px;padding:5px 10px;background:rgba(0,0,0,.45);border:1px solid var(--line);cursor:pointer;font-family:var(--mono);font-size:.8em;color:var(--gold-hi);text-align:center}
.bind.wait{border-color:var(--blood-hi);color:var(--blood-hi);animation:pulse 1s infinite}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:calc(15px * var(--ui-scale))}
#hud.fade{opacity:0;transition:opacity .6s}
.hud-bl{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:min(300px,40vw)}
.bar{position:relative;height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.bar .lag{position:absolute;inset:0;width:100%;background:rgba(255,230,200,.35);transition:width .6s ease .25s}
.bar .fill{position:absolute;inset:0;width:100%;transition:width .12s}
.bar.hp .fill{background:linear-gradient(180deg,#b3302a,#6d1512)}
.bar.san .fill{background:linear-gradient(180deg,#8ea0d1,#465579)}
.bar.st{height:4px;margin-top:5px;border-color:rgba(255,255,255,.05)}
.bar.st .fill{background:linear-gradient(180deg,#d4ccbb,#8f877a)}
.bar.xp{height:3px;margin-top:4px;border:none;background:rgba(255,255,255,.06)}
.bar.xp .fill{background:var(--xp)}
.bar-lbl{display:flex;justify-content:space-between;font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim);margin-top:7px;text-shadow:0 1px 2px #000}
.bar-lbl b{font-weight:normal;color:var(--bone);font-family:var(--mono);letter-spacing:0}
.bar.low .fill{animation:lowp .8s infinite}
@keyframes lowp{50%{filter:brightness(1.8)}}
.hud-br{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:16px}
.lamp{position:relative;width:34px;height:84px;border:1px solid rgba(255,255,255,.12);border-radius:14px 14px 5px 5px;background:rgba(0,0,0,.55);overflow:hidden}
.lamp .oil{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(180deg,#f5c565,#9c5d16);transition:height .3s}
.lamp .oil::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,240,200,.7)}
.lamp.off .oil{filter:grayscale(.8) brightness(.55)}
.lamp .glow{position:absolute;left:50%;top:-26px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.6),transparent 65%);opacity:0;transition:opacity .3s}
.lamp-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.lamp-wrap span{font-size:.62em;letter-spacing:.2em;color:var(--bone-dim);text-transform:uppercase}
.wpn{text-align:right;min-width:150px}
.wpn .wn{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:.86em;color:var(--bone);text-shadow:0 1px 3px #000}
.wpn .wa{font-family:var(--mono);font-size:.78em;color:var(--gold)}
.wpn .ws{font-size:.66em;color:var(--bone-faint);letter-spacing:.1em}
.belt{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.slot{position:relative;width:46px;height:46px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.55);image-rendering:pixelated}
.slot img{position:absolute;inset:3px;width:38px;height:38px;image-rendering:pixelated}
.slot .k{position:absolute;left:2px;top:0;font-family:var(--mono);font-size:.62em;color:var(--bone-dim)}
.slot .n{position:absolute;right:3px;bottom:1px;font-family:var(--mono);font-size:.7em;color:var(--bone);text-shadow:0 0 2px #000,0 0 2px #000}
.slot.empty img{opacity:.15}
.slot.flash{animation:slotf .35s}
@keyframes slotf{from{background:rgba(202,161,90,.5)}}
.hud-tl{position:absolute;left:max(26px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top));max-width:46vw}
.floor-n{font-family:var(--display);letter-spacing:.2em;font-size:.8em;text-transform:uppercase;color:var(--bone-dim);text-shadow:0 1px 3px #000}
.obj{margin-top:6px;font-size:.86em;color:var(--bone);text-shadow:0 1px 3px #000;display:flex;gap:8px;align-items:baseline}
.obj::before{content:'';width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg);flex:none;position:relative;top:-1px}
.obj.done{color:var(--gold-hi)}
.hunt-t{margin-top:6px;font-size:.72em;letter-spacing:.14em;color:var(--blood-hi);text-transform:uppercase;text-shadow:0 0 8px rgba(200,30,30,.6)}
.hud-tr{position:absolute;right:max(26px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top));text-align:right}
.lvl{font-family:var(--display);letter-spacing:.14em;font-size:.8em;color:var(--bone-dim);text-transform:uppercase}
.lvl b{color:var(--gold-hi);font-weight:normal;font-size:1.3em}
.coins{font-family:var(--mono);font-size:.82em;color:var(--gold);margin-top:4px}
.status{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;max-width:260px}
.stat-i{font-size:.66em;padding:2px 6px;border:1px solid var(--line);background:rgba(0,0,0,.55);letter-spacing:.1em;text-transform:uppercase}
.stat-i.bad{border-color:rgba(200,40,40,.5);color:#e28b8b}
.stat-i.good{border-color:rgba(202,161,90,.5);color:var(--gold-hi)}
#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:rgba(230,220,200,.55);border-radius:50%;box-shadow:0 0 3px #000;transition:transform .1s,opacity .2s}
#crosshair.hit{transform:scale(2.4);background:#e6a0a0}
#crosshair.int{transform:scale(1.8);background:var(--gold-hi)}
#charge{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;opacity:0}
#prompt{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);text-align:center;font-size:.92em;color:var(--bone);text-shadow:0 1px 3px #000,0 0 10px #000;white-space:nowrap}
#prompt .sub{display:block;font-size:.76em;color:var(--bone-dim);font-style:italic;margin-top:2px}
#prompt .cmp{display:block;font-size:.74em;margin-top:3px}
.up{color:#9fd08a}.down{color:#e07a6a}
#notify{position:absolute;left:max(26px,env(safe-area-inset-left));top:34%;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.note-i{font-size:.84em;padding:4px 12px 4px 10px;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,0));border-left:2px solid var(--gold);animation:rise .3s ease both;text-shadow:0 1px 2px #000}
.note-i.bad{border-left-color:var(--blood-hi)}
.note-i.san{border-left-color:var(--sanity)}
.note-i.out{opacity:0;transition:opacity .6s}
#subs{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;max-width:70vw}
.sub-i{font-size:.84em;padding:3px 12px;background:rgba(0,0,0,.66);color:var(--bone);font-style:italic;animation:scrIn .25s both}
.sub-i.out{opacity:0;transition:opacity .5s}
#bigmsg{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:1.6em;color:var(--bone);text-shadow:0 0 20px #000,0 0 40px #000;opacity:0;transition:opacity .8s}
#bigmsg small{display:block;font-family:var(--serif);letter-spacing:.06em;text-transform:none;font-style:italic;font-size:.55em;color:var(--bone-dim);margin-top:.6em}
#bigmsg.on{opacity:1}
#bossbar{position:absolute;left:50%;top:max(28px,env(safe-area-inset-top));transform:translateX(-50%);width:min(560px,60vw);text-align:center}
#bossbar .bn{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:.9em;color:var(--bone);text-shadow:0 0 12px #000}
#bossbar .bar{height:8px}
@media (max-width:1100px){#bossbar{top:118px;width:min(460px,60vw)}}
#bossbar .bar .fill{background:linear-gradient(180deg,#e0b561,#8a3f10)}
#dmgdir{position:absolute;inset:0}
.dd{position:absolute;left:50%;top:50%;width:0;height:0}
.dd i{position:absolute;left:-60px;top:-190px;width:120px;height:40px;background:radial-gradient(ellipse at 50% 100%,rgba(200,20,20,.75),transparent 70%);animation:ddf 1s ease-out forwards}
@keyframes ddf{to{opacity:0}}
#vignette-hit{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(160,0,0,.0);transition:box-shadow .2s}
#lockhint{position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,.7);border:1px solid var(--line-hi);font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:.8em;color:var(--gold-hi);animation:pulse 2s infinite}
#hints{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center}
.hint-i{display:inline-block;padding:8px 18px;background:rgba(0,0,0,.72);border:1px solid var(--line);font-size:.88em;animation:rise .4s both;max-width:520px}
.hint-i.out{opacity:0;transition:opacity .6s}
#fps{position:absolute;right:8px;top:4px;font-family:var(--mono);font-size:11px;color:#8f8;text-shadow:0 0 2px #000;pointer-events:none}
.floaty{position:absolute;font-family:var(--mono);font-size:.82em;color:#e8d6b0;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
.floaty.crit{color:#ffcf6a;font-size:1.05em}
.floaty.pl{color:#ff7a6a}
.ehp{position:absolute;width:60px;height:4px;margin-left:-30px;background:rgba(0,0,0,.6);border:1px solid rgba(0,0,0,.8)}
.ehp i{position:absolute;left:0;top:0;bottom:0;background:#b22c24}
.ehp.elite i{background:#d69a3a}
.ehp-n{position:absolute;transform:translate(-50%,-100%);font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:#e7c98a;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;margin-top:-6px}

/* ---------- journal / inventory ---------- */
#scr-journal .panel{width:min(1040px,96vw);height:min(720px,92vh);display:flex;flex-direction:column;padding:18px 24px}
.jbody{flex:1;overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.icard{display:flex;gap:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);padding:8px;cursor:pointer;align-items:flex-start;transition:border-color .15s,background .15s;pointer-events:auto}
.icard:hover,.icard.focus{border-color:var(--line-hi);background:rgba(202,161,90,.06)}
.icard img{width:40px;height:40px;image-rendering:pixelated;flex:none;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06)}
.icard .in{font-size:.9em;color:var(--bone)}
.icard .id{font-size:.74em;color:var(--bone-dim);line-height:1.35;margin-top:2px}
.icard .ic{font-family:var(--mono);font-size:.75em;color:var(--gold)}
.icard.cursed .in{color:#d47575}
.rar-1 .in,.rar-1.in{color:#9fc0e6!important}
.rar-2 .in,.rar-2.in{color:#e6c46a!important}
.rar-3 .in,.rar-3.in{color:#e0795f!important}
.equip-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.attr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.attr{border:1px solid var(--line);padding:10px 12px;background:rgba(0,0,0,.3)}
.attr .an{font-family:var(--display);letter-spacing:.16em;text-transform:uppercase;font-size:.85em;color:var(--gold)}
.attr .av{font-size:1.8em;font-family:var(--display);color:var(--bone);float:right;line-height:1}
.attr .ad{font-size:.74em;color:var(--bone-dim);margin-top:4px;clear:both}
.attr .plus{pointer-events:auto;margin-top:6px}
.stat-table{display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-size:.84em;margin-top:10px}
.stat-table span:nth-child(odd){color:var(--bone-dim)}
.stat-table span:nth-child(even){font-family:var(--mono);color:var(--bone)}
.boon-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.boon-t{font-size:.76em;padding:3px 8px;border:1px solid var(--line);background:rgba(0,0,0,.35)}
#map-canvas{width:100%;max-width:640px;aspect-ratio:1/1;display:block;margin:0 auto;image-rendering:pixelated;border:1px solid var(--line);background:#050403}
.note-body{white-space:pre-wrap;line-height:1.65;font-size:1em;color:#e3d5b6;max-width:640px;margin:0 auto;font-style:italic}
.note-list{display:flex;flex-direction:column;gap:4px}
.note-li{padding:8px 12px;border:1px solid var(--line);cursor:pointer;background:rgba(0,0,0,.3);pointer-events:auto}
.note-li:hover{border-color:var(--line-hi)}
.note-li.locked{opacity:.4;cursor:default}
.two-col{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:18px;height:100%}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.howto h3{margin:10px 0 2px;font-size:.92em}
.howto p{margin:0 0 4px;font-size:.88em;color:var(--bone-dim);line-height:1.5}
.howto .full{grid-column:1/-1}
.howto .keys{display:grid;grid-template-columns:repeat(3,auto 1fr);gap:5px 12px;font-size:.86em;align-items:center}
.howto .keys span{color:var(--bone-dim)}
@media (max-width:760px){.howto{grid-template-columns:1fr}.howto .keys{grid-template-columns:auto 1fr}}
.beast{display:flex;gap:14px;align-items:flex-start}
.beast canvas{flex:none;border:1px solid var(--line);background:#050403}

/* ---------- level up / cards ---------- */
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.card{width:220px;min-height:250px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(30,22,15,.95),rgba(10,8,6,.95));padding:18px 16px;cursor:pointer;text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;animation:rise .45s both;pointer-events:auto}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:hover,.card.focus{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px rgba(202,161,90,.12)}
.card img{width:64px;height:64px;image-rendering:pixelated;margin:4px 0 10px}
.card .cn{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:.95em;color:var(--gold-hi)}
.card .ck{font-size:.68em;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-faint);margin:3px 0 10px}
.card .cd{font-size:.84em;color:var(--bone-dim);line-height:1.45}
.card.curse .cn{color:#e07a6a}
.attr-pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* ---------- shop ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.price{font-family:var(--mono);color:var(--gold);font-size:.85em;margin-left:auto;white-space:nowrap}
.icard.cant{opacity:.45}

/* ---------- death / ending ---------- */
#scr-dead h1{font-size:clamp(28px,5vw,64px);letter-spacing:.24em;color:#c9b99a;text-transform:uppercase;text-shadow:0 0 30px rgba(140,0,0,.5);margin-bottom:.2em}
.epitaph{font-style:italic;color:var(--bone-dim);text-align:center;max-width:560px;margin:0 auto 12px;line-height:1.6}
.run-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:14px auto;width:min(720px,92vw)}
.rs{text-align:center;border:1px solid var(--line);padding:8px;background:rgba(0,0,0,.35)}
.rs b{display:block;font-family:var(--display);font-size:1.5em;font-weight:normal;color:var(--bone)}
.rs span{font-size:.68em;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim)}
.embers-gain{font-family:var(--display);letter-spacing:.2em;color:var(--gold-hi);text-align:center;font-size:1.1em;text-transform:uppercase}
.story{max-width:680px;line-height:1.8;font-size:1.08em;text-align:center;color:#e0d2b4}
/* long story-style screens scroll instead of clipping on short windows (auto margins keep them centred when they fit) */
#scr-dead,#scr-ending,#scr-intro,#scr-transition{overflow-y:auto;justify-content:flex-start}
#scr-dead>:first-child,#scr-ending>:first-child,#scr-intro>:first-child,#scr-transition>:first-child{margin-top:auto}
#scr-dead>:last-child,#scr-ending>:last-child,#scr-intro>:last-child,#scr-transition>:last-child{margin-bottom:auto}
@media (max-width:520px){.btn{white-space:normal;letter-spacing:.12em;padding:9px 18px}.btn:hover,.btn.focus{letter-spacing:.16em}.story{font-size:.98em}}
.story p{animation:rise 1.2s both}
#scr-transition .fl-num{font-family:var(--display);letter-spacing:.6em;color:var(--bone-dim);font-size:.9em;padding-left:.6em}
#scr-transition .fl-name{font-family:var(--display);letter-spacing:.2em;font-size:clamp(26px,4.6vw,56px);text-transform:uppercase;color:#eadcc0;margin:.25em 0;text-align:center;text-shadow:0 0 30px rgba(255,160,70,.2)}
#scr-transition .fl-quote{font-style:italic;color:var(--bone-dim);max-width:560px;text-align:center;line-height:1.6}

/* ---------- vigil (meta) ---------- */
.up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.upg{border:1px solid var(--line);padding:12px;background:rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px}
.upg .un{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:.88em}
.upg .ud{font-size:.78em;color:var(--bone-dim);flex:1;line-height:1.4}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;border:1px solid var(--gold-dim);transform:rotate(45deg)}
.pips i.f{background:var(--gold)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ach{border:1px solid var(--line);padding:9px 11px;background:rgba(0,0,0,.3);font-size:.84em}
.ach.got{border-color:var(--line-hi);background:rgba(202,161,90,.07)}
.ach .an{color:var(--bone);font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:.9em}
.ach:not(.got) .an{color:var(--bone-faint)}
.ach .ad{color:var(--bone-dim);font-size:.85em;margin-top:2px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast-i{padding:10px 18px;background:rgba(10,8,6,.95);border:1px solid var(--gold);font-size:.86em;animation:rise .4s both;box-shadow:0 8px 30px rgba(0,0,0,.7)}
.toast-i b{display:block;font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);font-weight:normal;font-size:.8em;margin-bottom:2px}
.toast-i.out{opacity:0;transform:translateY(-10px);transition:all .5s}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none}
#touch.on{pointer-events:auto}
.tstick{position:absolute;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.2);pointer-events:none}
.tstick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(220,200,160,.22);border:1px solid rgba(255,255,255,.2)}
.tbtn{position:absolute;width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:var(--bone);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display)}
.tbtn.act{background:rgba(202,161,90,.3)}

#err{position:fixed;inset:0;z-index:100;background:#000;color:var(--bone);display:none;align-items:center;justify-content:center;padding:24px}
#err.on{display:flex}
#err pre{white-space:pre-wrap;font-size:11px;color:#b98;max-height:30vh;overflow:auto;background:#0a0808;padding:10px;border:1px solid #311}
#fader{position:fixed;inset:0;background:#000;pointer-events:none;z-index:25;opacity:0;transition:opacity .6s}
#fader.on{opacity:1}
#fader.fast{transition:opacity .15s}
#scare{position:fixed;inset:0;pointer-events:none;z-index:26;opacity:0}
body.touch .hud-br{right:auto;left:50%;transform:translateX(-50%) scale(.82);transform-origin:50% 100%;bottom:4px}
body.touch .hud-tr{top:14px;right:150px}
body.touch .hud-bl{width:32vw;bottom:6px}
body.touch .slot{pointer-events:auto}
body.touch #hints{top:6%}
body.touch #prompt{top:calc(50% + 26px)}
@media (max-width:720px){
  .hud-bl{width:52vw}
  .logo{top:9vh}
  .set-list{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .card{width:44vw;min-height:200px;padding:12px}
}
@media (prefers-reduced-motion:reduce){.logo .name{animation:none}.candle-ico b{animation:none}}
</style>

<script>
'use strict';
/* =====================================================================
   THE TALLOW DEEP
   A first-person gothic horror roguelike RPG in a single file.
   Everything — renderer, textures, models, audio, levels — is generated
   at runtime. No external assets.
   ===================================================================== */
const VERSION = '1.0.0';
const SAVE_PREFIX = 'tallowdeep.v1.';
const CELL = 2.5;              // world units per grid cell
const FINAL_FLOOR = 10;
const TAU = Math.PI * 2;

/* ---------------------------------------------------------------------
   Small math helpers
--------------------------------------------------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const sign = v => v < 0 ? -1 : 1;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function dist2(ax, az, bx, bz) { const dx = ax - bx, dz = az - bz; return Math.sqrt(dx * dx + dz * dz); }
function v3(x = 0, y = 0, z = 0) { return { x, y, z }; }
function fmt(n) { return Math.round(n).toString(); }
function roman(n) { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

/* ---------------------------------------------------------------------
   Seeded RNG
--------------------------------------------------------------------- */
function hashStr(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() { let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), 1 | t); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }

/* Convert painted layers into GPU-ready byte arrays */
function finalizeLayer(t, alb, nrm, off) {
  const S = TS;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x, o = off + i * 4;
    alb[o] = clamp(t.c[i * 3], 0, 1) * 255; alb[o + 1] = clamp(t.c[i * 3 + 1], 0, 1) * 255; alb[o + 2] = clamp(t.c[i * 3 + 2], 0, 1) * 255; alb[o + 3] = clamp(t.a[i], 0, 1) * 255;
    const hl = t.h[y * S + (x - 1 + S) % S], hr = t.h[y * S + (x + 1) % S], hu = t.h[((y - 1 + S) % S) * S + x], hd = t.h[((y + 1) % S) * S + x];
    let nx = -(hr - hl) * t.bump, ny = -(hd - hu) * t.bump, nz = 1; const l = 1 / Math.hypot(nx, ny, nz); nx *= l; ny *= l; nz *= l;

/* Sprite atlas for particles/billboards: 4x4 cells of 64px */
const SPR = { GLOW: 0, FLAME: 1, SMOKE: 2, SPARK: 3, DROP: 4, DUST: 5, RING: 6, FIRE: 7, SPLAT: 8, SHARD: 9, WISP: 10, EMBER: 11, RUNE: 12, EYES: 13, GAS: 14, BEAM: 15 };

    const gr = g.createRadialGradient(cx, cy + hgt * 0.25, 1, cx, cy + hgt * 0.1, hgt * 0.62);
    gr.addColorStop(0, 'rgba(255,255,235,1)'); gr.addColorStop(0.25, 'rgba(255,225,140,1)'); gr.addColorStop(0.55, 'rgba(255,140,40,.85)'); gr.addColorStop(1, 'rgba(200,50,10,0)');

    g.bezierCurveTo(cx - w * 0.5, cy + hgt * 0.4, cx - w * 0.55, cy - hgt * 0.05, cx, cy - hgt * 0.5); g.fill();
  };

  cell(SPR.SMOKE, g => {
    const id = g.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const d = Math.hypot(x - 32, y - 32) / 32; const n = fbm(x / S, y / S, 4, 4, 7); const a = Math.max(0, 1 - d) * smooth(0.25, 0.75, n + (1 - d) * 0.35); const o = (y * S + x) * 4; id.data[o] = id.data[o + 1] = id.data[o + 2] = 200; id.data[o + 3] = a * 255; }

  cell(SPR.DROP, g => radial(g, [[0, 'rgba(255,255,255,1)'], [0.55, 'rgba(255,255,255,.9)'], [0.75, 'rgba(255,255,255,.2)'], [1, 'rgba(255,255,255,0)']], 28));
  cell(SPR.DUST, g => radial(g, [[0, 'rgba(255,255,255,.95)'], [0.3, 'rgba(255,255,255,.35)'], [1, 'rgba(255,255,255,0)']], 14));
  cell(SPR.RING, g => { g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3; g.beginPath(); g.arc(32, 32, 28, 0, TAU); g.stroke(); g.lineWidth = 1; g.globalAlpha = 0.5; g.beginPath(); g.arc(32, 32, 24, 0, TAU); g.stroke(); });
  cell(SPR.FIRE, g => { flame(g, 22, 36, 22, 44); flame(g, 42, 32, 24, 54); flame(g, 32, 40, 30, 40); });
  cell(SPR.SPLAT, g => {
    const r = new RNG(99); g.fillStyle = '#fff';
    g.beginPath(); for (let k = 0; k <= 24; k++) { const a = k / 24 * TAU, rr = 14 + r.range(-4, 7); g.lineTo(32 + Math.cos(a) * rr, 32 + Math.sin(a) * rr); } g.fill();

  cell(SPR.RUNE, g => {
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 2.5; g.beginPath(); g.arc(32, 32, 29, 0, TAU); g.stroke(); g.beginPath(); g.arc(32, 32, 22, 0, TAU); g.stroke();
    g.lineWidth = 1.6; for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; g.beginPath(); g.moveTo(32 + Math.cos(a) * 23, 32 + Math.sin(a) * 23); g.lineTo(32 + Math.cos(a + 0.2) * 28, 32 + Math.sin(a + 0.2) * 28); g.lineTo(32 + Math.cos(a + 0.35) * 23, 32 + Math.sin(a + 0.35) * 23); g.stroke(); }
    g.beginPath(); for (let k = 0; k < 5; k++) { const a = k * 4 / 5 * Math.PI - Math.PI / 2; g.lineTo(32 + Math.cos(a) * 18, 32 + Math.sin(a) * 18); } g.closePath(); g.stroke();

  cell(SPR.GAS, g => {
    const id = g.createImageData(S, S);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const d = Math.hypot(x - 32, y - 32) / 32; const n = fbm(x / S, y / S, 3, 4, 13); const a = Math.max(0, 1 - d * d) * n; const o = (y * S + x) * 4; id.data[o] = id.data[o + 1] = id.data[o + 2] = 255; id.data[o + 3] = a * 255; }

  });

/* =====================================================================
   RENDERER (WebGL2)
   Forward-lit world with per-pixel point lights. Walls cast exact
   shadows via a DDA march through the level grid; creatures cast
   shadows as analytic cylinders. Scene renders to a low-res HDR
   target, then bloom + a filmic, dithered composite.
   ===================================================================== */
const MAXL = 16, MAXO = 8;
const SH_WORLD_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUV;
layout(location=3) in float aLayer;
layout(location=4) in float aAO;
layout(location=5) in vec3 aTan;
uniform mat4 uVP, uModel;
uniform vec2 uSnap;
uniform float uTime, uWobble;
out vec3 vW; out vec3 vN; out vec3 vT; out vec2 vUV; flat out float vL; out float vAO;
void main(){
  vec4 wp = uModel * vec4(aPos, 1.0);

  vN = m * aNrm; vT = m * aTan;
  if (uWobble > 0.0) wp.xyz += normalize(vN) * sin(uTime * 1.7 + wp.y * 2.3 + wp.x * 1.3 + wp.z * 1.1) * uWobble;
  vW = wp.xyz; vUV = aUV; vL = aLayer; vAO = aAO;
  vec4 cp = uVP * wp;

}`;
const SH_WORLD_FS = `#version 300 es

precision highp sampler2DArray;
in vec3 vW; in vec3 vN; in vec3 vT; in vec2 vUV; flat in float vL; in float vAO;
uniform sampler2DArray uAlb, uNrmT;
uniform sampler2D uGrid;
uniform vec3 uGridInfo;
uniform int uNL;
uniform vec4 uLP[${MAXL}];
uniform vec4 uLC[${MAXL}];
uniform int uNO;
uniform vec4 uOcc[${MAXO}];
uniform int uSelf;
uniform vec3 uCam, uFogC, uAmb;
uniform float uFogD, uNear, uTime;
uniform vec4 uTint;
uniform vec4 uEmis;
out vec4 oC;
float bayer4(vec2 p){
  ivec2 q = ivec2(mod(p, 4.0));
  int i = q.x + q.y * 4;
  float m[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);

}
float gridShadow(vec2 p, vec2 l){
  ivec2 c = ivec2(floor(p)); ivec2 lc = ivec2(floor(l));
  if (c == lc) return 1.0;
  vec2 d = l - p;
  ivec2 st = ivec2(d.x > 0.0 ? 1 : -1, d.y > 0.0 ? 1 : -1);
  vec2 ad = max(abs(d), vec2(1e-5));
  vec2 tD = 1.0 / ad;

    if (i >= uNL) break;

    float d2 = dot(Lv, Lv);
    if (d2 > r * r) continue;
    float d = sqrt(d2);
    vec3 L = Lv / max(d, 1e-4);
    if (dot(Ng, L) < -0.05) continue;
    float wrap = clamp((dot(N, L) + 0.25) / 1.25, 0.0, 1.0);
    if (wrap <= 0.0) continue;

    if (sh <= 0.0) continue;
    sh *= occShadow(vW, uLP[i].xyz);
    vec3 H = normalize(L + V);
    float sp = pow(max(dot(N, H), 0.0), 6.0 + gloss * 60.0) * gloss * 1.4;
    col += uLC[i].rgb * att * sh * (alb * wrap * vAO + sp * wrap);

  oC = vec4(mix(uFogC, col, fog), 1.0);

layout(location=1) in vec4 aPS;

class Mesh {
  constructor(gl, verts, idx, bounds) {
    this.gl = gl; this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);

  nicheDepth(n, wx, wz) {

  los(ax, az, bx, bz, useDoors = true) {
    let x = Math.floor(ax / CELL), y = Math.floor(az / CELL); const ex = Math.floor(bx / CELL), ey = Math.floor(bz / CELL);

    let tmy = dz > 0 ? ((y + 1) * CELL - az) / dz : dz < 0 ? (y * CELL - az) / dz : 1e9;

      if (tmx < tmy) { if (tmx > 1) return true; tmx += tdx; x += sx; } else { if (tmy > 1) return true; tmy += tdy; y += sy; }

      if (this.cell[i2] === C_SOLID) return false;
      if (useDoors && this.light[i2]) return false;
    }
    return true;
  }
}

/* ---------------------------------------------------------------------
   Level generator
--------------------------------------------------------------------- */
const Gen = {
  run(floor, seed, runState) {
    const rng = new RNG(seed);
    const zi = zoneOf(floor), Z = ZONES[zi];
    if (floor >= FINAL_FLOOR) return this.bossLevel(rng, floor);
    const size = Math.min(34 + floor * 2, 52);
    let L = null;
    for (let attempt = 0; attempt < 8; attempt++) {
      L = this.layout(rng, size, size, 9 + Math.min(floor, 7) + rng.int(0, 2), Z);
      if (L && L.rooms.length >= 6) break;
    }
    L.floor = floor; L.zone = zi; L.Z = Z; L.seed = seed;
    this.roles(rng, L, floor);
    this.themes(rng, L, Z, floor);
    this.stairs(rng, L);
    this.decorate(rng, L, Z, floor);
    this.populate(rng, L, Z, floor, runState);
    this.finalize(L);

const Models = {};

/* A rig is a list of parts; each part has a mesh, a parent, and a pivot

class Rig {
  constructor(parts) { this.parts = parts; this.n = parts.length; this.mats = parts.map(() => M4.create()); }
  pose() { return this.parts.map(() => [0, 0, 0]); }
  draw(root, pose, tint, emisFn, self) {
    for (let i = 0; i < this.n; i++) {
      const p = this.parts[i], m = this.mats[i];
      if (p.parent < 0) M4.copy(m, root); else M4.copy(m, this.mats[p.parent]);
      M4.translate(m, p.off[0], p.off[1], p.off[2]);
      const r = pose[i]; if (r.length > 3) M4.translate(m, r[3], r[4], r[5]); if (r[1]) M4.rotateY(m, r[1]); if (r[0]) M4.rotateX(m, r[0]); if (r[2]) M4.rotateZ(m, r[2]);
      if (p.hide) continue;
      if (p.mesh) R.draw(p.mesh, m, tint, p.emis ? (emisFn ? emisFn(p) : p.emis) : null, self);
      if (p.extra) R.draw(p.extra, m, tint, null, self);

  worldPos(i, lx = 0, ly = 0, lz = 0) { const o = [0, 0, 0]; M4.transformPoint(this.mats[i], lx, ly, lz, o); return o; }
}

];
const CURSE_AFFIX = { id: 'cursed', name: 'Cursed', desc: '+45% damage, but every kill costs 3 sanity', mod: w => { w.dmg *= 1.45; w.cursed = true; } };
function makeWeapon(base, rarity = 0, rng = FX, affixIds = null) {
  const B = WEAPONS[base]; const w = Object.assign({ base, rarity, affixes: [] }, JSON.parse(JSON.stringify(B)));
  let ids = affixIds;
  if (!ids) {
    ids = [];
    if (rarity === 3) ids.push('cursed');
    const n = rarity === 0 ? 0 : rarity === 1 ? 1 : rarity === 2 ? 2 : 1;
    const pool = AFFIXES.filter(a => !(B.ranged && (a.id === 'serrated' || a.id === 'burning' || a.id === 'hungering')));
    while (ids.length < n + (rarity === 3 ? 1 : 0)) { const a = rng.pick(pool); if (!ids.includes(a.id)) ids.push(a.id); }
  }
  for (const id of ids) { const a = id === 'cursed' ? CURSE_AFFIX : AFFIXES.find(x => x.id === id); if (a) { a.mod(w); w.affixes.push(id); } }
  const pre = w.affixes.map(id => (id === 'cursed' ? CURSE_AFFIX : AFFIXES.find(x => x.id === id)).name);
  w.name = (pre.length ? pre.join(' ') + ' ' : '') + B.name.replace(/^(Rusted|Iron|Silvered|Burning) /, m => pre.length ? '' : m);
  if (!pre.length) w.name = B.name;
  return w;
}
function weaponFromSave(o) { return o ? makeWeapon(o.base, o.rarity, FX, o.affixes) : null; }
function weaponSave(w) { return w ? { base: w.base, rarity: w.rarity, affixes: w.affixes } : null; }
function weaponLine(w) {
  if (!w) return '';
  if (w.ranged) return `${Math.round(w.dmg)}${w.pellets > 1 ? '×' + w.pellets : ''} dmg · ${w.reload.toFixed(1)}s reload`;
  return `${Math.round(w.dmg)} dmg · ${(1 / w.time).toFixed(1)}/s · reach ${w.reach.toFixed(1)}`;
}
function weaponDesc(w) {
  const bits = [];
  for (const id of w.affixes) { const a = id === 'cursed' ? CURSE_AFFIX : AFFIXES.find(x => x.id === id); if (a) bits.push(w.ranged && id === 'long' ? 'Tighter spread' : a.desc); }
  if (w.holy && !w.affixes.includes('blessed')) bits.push('Harms spectral things');
  if (w.light) bits.push('Sheds light');
  if (w.cleave) bits.push('Strikes up to ' + (w.cleave + 1) + ' foes');
  if (w.bleed && !w.affixes.includes('serrated')) bits.push(Math.round(w.bleed * 100) + '% bleed chance');
  if (w.burn && !w.affixes.includes('burning')) bits.push(Math.round(w.burn * 100) + '% ignite chance');
  return bits.join('. ');
}

  { id: 1, z: 0, title: 'Admissions Ledger, p. 212', text: 'Nine received this week from the lower town. Fever, flux, one burned (lamp oil).\n\nBrother Hesk asks that the dying be moved to the cellar wards "for the quiet." Father Aldous approves.\n\nI do not understand why the cellar needs so many beds when the churchyard has so much room.\n\n— A.' },
  { id: 2, z: 0, maren: 1, title: 'A Letter, Unsent (I)', text: 'Dear {sib},\n\nThe sisters say I have a gift for the dying. I hold their hands and they are not afraid. The hospice is warm and smells of beeswax.\n\nFather Aldous says our candles are special — rendered here, by our own hands. I am learning so much.\n\nDon\'t let Mother worry.\n\n— Your Maren' },
  { id: 3, z: 0, title: 'Laundry Rota (torn)', text: 'Linens from Ward C to be boiled thrice.\n\nDo NOT send Ward C linens to the town washerwomen. Stains that will not lift are to be burned.\n\nAny sister asking why the stains are yellow, and smell of candles, is to be referred to Brother Hesk.' },
  { id: 4, z: 0, title: "Brother Ansel's Confession", text: 'I carried Old Wenna down myself. She was not dead. She was only sleeping, Father said, and would not feel it.\n\nThe Chandlers took her to the lower stair and I heard the vats begin to bubble.\n\nGod forgive me — the candle they made from her burned so bright.' },
  { id: 5, z: 0, title: "The Sexton's Warning", text: 'To whoever holds my keys after me:\n\nThe gate to each stair locks from above. I have hidden the keys in rooms the Hollowed guard — they gather where the keys are warm from my hand.\n\nIf you are reading this, the lights have gone out.\n\nKeep moving. Do not linger.' },
  { id: 6, z: 0, maren: 2, title: 'A Letter, Unsent (II)', text: '{sib},\n\nSomething is wrong with the patients in the cellar. They don\'t die. They stop breathing and then, hours later, they sit up.\n\nFather Aldous calls them "the Hollowed." Their light is gone, he says, but the body doesn\'t know it yet.\n\nI have been told not to write about this. I am writing anyway.\n\n— M.' },
  { id: 7, z: 0, title: "A Child's Drawing", text: '(Charcoal on the back of a hymn sheet. A small figure holds a candle. Behind it looms a very tall figure with no face and arms that reach the floor.)\n\nBeneath, in a child\'s careful letters:\n\nTHE TALL MAN EATS THE CANDLES.\nWHEN THE BELL RINGS HE IS COMING.\nDONT STAY. DONT STAY. DONT STAY.' },
  { id: 8, z: 1, title: "Brother Ansel's Journal", text: 'Down here the brothers of old stacked the dead into walls. I used to find it beautiful.\n\nNow I hear the skulls singing when the candles gutter. Brother Hesk says it is only the wind in the eye-holes.\n\nThere is no wind this deep.' },
  { id: 9, z: 1, maren: 3, title: 'A Letter, Unsent (III)', text: '{sib} —\n\nI\'ve found the lower stairs. There is a light down there that isn\'t fire. It hums. The Hollowed walk toward it like moths.\n\nI think the candles aren\'t keeping something away.\n\nI think they\'re keeping something FED.' },
  { id: 10, z: 1, title: 'Hymnal, Annotated', text: '"The Choir of Bones shall sing the Vigil so long as the Mother burns."\n\nIn the margin, scrawled hard enough to tear the page:\n\nthey do not sing to the Mother. they sing to wake HIM.\nstop your ears. break their sight. the song cannot follow what it cannot see.' },
  { id: 11, z: 1, title: "Sister Agathe's Journal", text: 'The Mourners do not walk while watched. They are shy, I think, the way grief is shy.\n\nKeep your lamp upon them and they stand like statues. Turn your back and they will be at your shoulder, weeping.\n\nA sudden brightness frightens them off entirely — for a time.' },
  { id: 12, z: 1, title: 'Ledger of the Drowned Crypts', text: 'Flooded in the fever year. Forty-one interred. Forty-one recovered for rendering.\n\nThe water does not freeze down here, though it should.\n\nSomething keeps it warm from below.' },
  { id: 13, z: 1, maren: 4, title: 'A Letter, Unsent (IV)', text: '{sib}, if you come for me — and I know you will, you never listen — bring oil. More than you think.\n\nThe dark here isn\'t empty. It LEANS on you. When my lamp went out for a moment I heard it breathing, and it sounded like relief.\n\n— M.' },
  { id: 14, z: 1, title: 'Sermon Fragment', text: 'Beneath us sleeps the Hollow, which was here before the saints and will be here after.\n\nIt is hunger without a mouth. It drinks every light — save one.\n\nA light given freely, in love, cannot be drunk.\n\nSo we render. So we give. So we are saved.\n\n— Fr. Aldous Vane' },
  { id: 15, z: 2, title: "The Chandler's Rule", text: 'Rendering, per the Rule of Aldric:\n\nOne soul, freshly quieted. Seven hours in the lower vats. Skim the tallow at the golden hour.\n\nDo not skim the screaming layer; it spoils the wick.\n\nPour, cure, and bless. A good candle burns forty nights.' },
  { id: 16, z: 2, title: "Brother Hesk's Notes", text: 'The Wretches are what is left when the vats are skimmed poorly. They remember being people only the way wax remembers a mold.\n\nFire does not frighten them.\n\nThey ARE fire, waiting. Stand well back when one falls.' },
  { id: 17, z: 2, title: "Brother Ansel's Last Page", text: 'I will not render another.\n\nFather Aldous has gone into the Mother Candle himself — "to tend her from within," he said. Now she moves. Now she speaks with his voice, and with Wenna\'s, and with a hundred others.\n\nGod help me. I think I heard Maren.' },
  { id: 18, z: 2, maren: 5, title: 'A Letter, Unsent (V)', text: '{sib}.\n\nI\'m in the wax now. It doesn\'t hurt anymore. There are so many of us, and we\'re all so tired.\n\nIf you reach the Mother, say my name. Say it the way you did when we were small and I was afraid of the dark.\n\nI\'ll hear you. I\'ll help you let us go.' },
  { id: 19, z: 2, title: "The Sexton's Final Entry", text: 'The Wick-Eater walks every floor now. It follows whoever lingers.\n\nI have locked myself in with the ledgers and my last candle.\n\nWhoever you are: the deep rewards the quick and eats the careful. When the bell tolls, find the stair.' },
  { id: 20, z: 1, title: 'Pinned to a Crate', text: '"The Pale Merchant buys nothing and sells everything. Coin is accepted."\n\nBeneath, in another hand:\n\nHe was here before the hospice. He\'ll be here after. Don\'t ask his name. Don\'t let him see you counting.' },
  { id: 21, z: 0, title: 'Scratched into a Bedframe', text: 'I counted the candles.\n\nThere are more candles than there were patients.\n\nWhere do the extra candles come from? Where do the extra candles come from? Where do the extra' },
  { id: 22, z: 0, title: 'Nursing Note, Ward C', text: 'Bed 4 — patient requests the light be left on. Denied (oil shortage).\n\nPatient found at dawn with fingers worn to the bone, trying to dig through the wall toward the chapel candles.\n\nBed 4 reassigned.' },
];

class Pickup {
  constructor(item, x, z, opts = {}) {

  get mesh() { if (this.weapon) return Models.weapons[this.weapon.base]; if (this.relic) return Models.items.relic; return Models.items[this.item] || Models.items.relic; }

    if (this.weapon) { const old = P.equipWeapon(this.weapon); if (old) G.ents.push(new Pickup('weapon', P.x + Math.sin(P.yaw) * -0.6, P.z - Math.cos(P.yaw) * 0.6, { weapon: old, pop: true })); Sfx.play('equip'); this.dead = true; return; }

function pickNote() {
  const z = G.L.zone >= 3 ? 2 : G.L.zone;
  const seen = new Set([...G.run.notes, ...G.ents.filter(e => e.kind === 'note' && e.note).map(e => e.note.id)]);
  const metaSeen = new Set(Meta.data.notes);
  let pool = NOTES.filter(n => n.z === z && !seen.has(n.id) && !metaSeen.has(n.id));
  if (!pool.length) pool = NOTES.filter(n => n.z <= z && !seen.has(n.id) && !metaSeen.has(n.id));
  if (!pool.length) pool = NOTES.filter(n => n.z === z && !seen.has(n.id));
  if (!pool.length) return null;
  // Maren's letters come in order
  pool.sort((a, b) => (a.maren || 0) - (b.maren || 0) || a.id - b.id);
  const marenNext = pool.find(n => n.maren);
  return marenNext && Math.random() < 0.55 ? marenNext : pool[Math.floor(Math.random() * pool.length)];
}

/* ---------------- hallucinations ---------------- */
function spawnPhantom() {

  setFocus(el) { for (const e of document.querySelectorAll('.focus')) e.classList.remove('focus'); if (el) { el.classList.add('focus'); if (el.focus) el.focus({ preventScroll: false }); el.scrollIntoView && el.scrollIntoView({ block: 'nearest' }); } this._focus = el; },

  drawMap() {

      const ev = FX.weighted(['scream', 'footsteps', 'slam', 'flicker', 'apparition', 'whisper', 'rumble'], k => ({ scream: 1, footsteps: 1.2, slam: 1, flicker: 1, apparition: P.sanity < P.maxSan * 0.8 ? 1.2 : 0.4, whisper: 0.8, rumble: 0.6 }[k]));
      this.scare(ev);
    }
  },
  scare(ev) {
    const P = G.P, L = G.L;
    if (ev === 'scream') { const a = rnd(0, TAU); Sfx.play('scream', { pos: { x: P.x + Math.cos(a) * 26, z: P.z + Math.sin(a) * 26, y: 1 }, vol: 0.6 }); P.sanity = Math.max(0, P.sanity - 2 * P.horrorMul); }
    else if (ev === 'footsteps') { Sfx.play('footBehind'); UI.caption(CAPTIONS.footBehind, { x: P.x + Math.sin(P.yaw) * 4, z: P.z + Math.cos(P.yaw) * 4 }); }
    else if (ev === 'slam') { const doors = G.ents.filter(e => e.kind === 'door' && Math.hypot(e.x - P.x, e.z - P.z) < 25 && !L.los(P.x, P.z, e.x, e.z)); if (doors.length) { const d = FX.pick(doors); if (d.open) d.slam(); else Sfx.play('slam', { pos: d }); } }
    else if (ev === 'flicker') { P.lanternFlick = 1; setTimeout(() => { if (G.P) G.P.lanternFlick = 0; }, 1600); Sfx.play('whisper', { vol: 0.4 }); for (const l of L.lights) if (l.on && Math.hypot(l.x - P.x, l.z - P.z) < 12) { const b = l.base; l.base = b * 0.2; setTimeout(() => l.base = b, 400 + Math.random() * 1200); } }
    else if (ev === 'apparition') {
      const cp = Math.cos(P.pitch), fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
      for (let d = 16; d > 7; d -= 1.5) { const x = P.x + fx * d, z = P.z + fz * d; const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL); if (L.inb(cx, cz) && L.walk[L.idx(cx, cz)] && L.los(P.x, P.z, x, z)) { const e = new Enemy('hollow', x, z, false, { phantom: true }); e.apparition = true; e.yaw = Math.atan2(P.x - x, P.z - z); e.life = 4; e.state = 'still'; G.phantoms.push(e); break; } }
    }
    else if (ev === 'whisper') Sfx.play('whisper', { vol: 0.7 });
    else if (ev === 'rumble') { Sfx.play('rumble'); P.trauma = Math.min(1, P.trauma + 0.3); for (let i = 0; i < 30; i++) Parts.add({ x: P.x + rnd(-4, 4), y: 3, z: P.z + rnd(-4, 4), vy: -rnd(0.5, 2), life: 2, size: 0.03, size2: 0.02, r: 0.5, g: 0.45, b: 0.4, a: 0.8, a2: 0, spr: SPR.DUST, grav: 2, lit: 1, add: 0 }); }
  },
  /* ---------------- title scene ---------------- */
  updateTitle(dt) {
    this.titleT += dt; G.t += dt; Parts.update(dt); updateLights(dt);
    const f = this.titleFig; f.t -= dt;
    if (f.t <= 0) { if (f.show > 0) { f.show = 0; f.t = rnd(9, 16); } else { f.show = 1; f.t = rnd(2.5, 4.5); const cz = this.titleCamera().z; f.z = cz - rnd(8, 12); f.x = 6 * CELL + (FX.chance(0.5) ? -0.05 : 0.05); } }
    if (Math.random() < dt * 0.6) Parts.add({ x: 6 * CELL + rnd(-2, 2), y: rnd(0.5, 3.5), z: rnd(10, 22) * CELL * 0.4 + 30, vx: rnd(-0.05, 0.05), vy: rnd(-0.05, 0.05), vz: rnd(-0.05, 0.05), life: 6, size: 0.02, size2: 0.02, r: 1, g: 0.9, b: 0.8, a: 0, a2: 0.6, spr: SPR.DUST, lit: 1, add: 1, pulse: true });
  },
  titleCamera() {
    const t = this.titleT; const z = (26 - Math.min(t, 180) * 0.02) * CELL - Math.sin(t * 0.05) * 3;
    return { x: 6 * CELL + Math.sin(t * 0.13) * 0.4, y: 1.7 + Math.sin(t * 0.21) * 0.05, z, yaw: Math.sin(t * 0.09) * 0.08, pitch: 0.02 + Math.sin(t * 0.11) * 0.03, roll: Math.sin(t * 0.07) * 0.01 };
  },
  /* ---------------- render ---------------- */
  render(dt) {
    const L = G.L; if (!L) return; R.resize();
    const Z = L.Z || ZONES[0];
    R.fog = Z.fog; R.fogD = Z.fogD; R.amb = Z.amb; R.post.grade = Z.grade;
    R.near = Z.near * (0.6 + SETTINGS.brightness * 0.4) * (G.P && G.P.boons.nighteyes ? 1 + 0.5 * G.P.boons.nighteyes : 1);
    let cam, lantern = null;
    if (this.state === 'title' || !G.P) {
      cam = this.titleCamera(); R.post.fade = 0; R.post.exposure = 1.1;
      R.setCamera(cam.x, cam.y, cam.z, cam.yaw, cam.pitch, cam.roll, 70);
      lantern = { x: cam.x - 0.3, y: cam.y - 0.3, z: cam.z - 0.4, r: 7, cr: 0.9, cg: 0.62, cb: 0.35, k: 0.08 };
    } else {
      const P = G.P; const eh = P.eyeH();
      const shake = P.trauma * P.trauma * SETTINGS.shake; const sx = (Math.sin(G.t * 43) + Math.sin(G.t * 67)) * 0.5 * shake, sy = (Math.sin(G.t * 51 + 1) + Math.sin(G.t * 73)) * 0.5 * shake;
      const bob = P.bobAmp * SETTINGS.headBob; const by = Math.sin(P.bobPh * 2) * 0.03 * bob, bx = Math.cos(P.bobPh) * 0.02 * bob;
      let y = P.y + eh + by, pitch = P.pitch + sy * 0.05 + P.kick * 0.04, yaw = P.yaw + sx * 0.05, roll = (P.dodgeRoll || 0) + sx * 0.02 + Math.sin(G.t * 0.7) * 0.025 * R.post.insane;
      if (P.dead) { const k = smooth(0, 1.4, P.deathT); y = lerp(y, P.y + 0.25, k); roll = lerp(roll, 1.2, k); pitch = lerp(pitch, 0.3, k); }
      const rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
      cam = { x: P.x + rx * bx, y, z: P.z + rz * bx, yaw, pitch, roll };
      R.post.exposure = 1;
      R.setCamera(cam.x, cam.y, cam.z, cam.yaw, cam.pitch, cam.roll, SETTINGS.fov * (1 + (P.raiseT * -0.03)));
      lantern = P.dead ? null : P.lanternLight(); P.curLight = lantern;
      // censer weapon sheds light
      if (P.weapon.light && P.censerPos && !P.dead) G.dynLights.push(this._censer = Object.assign(this._censer || mkLight(0, 0, 0, 'fire'), { x: P.censerPos[0], y: P.censerPos[1], z: P.censerPos[2], r: 5, base: 1.4, on: true }));
    }
    const cf = R.camF; Sfx.listener(cam.x, cam.y, cam.z, cf[0], cf[1], cf[2]);
    gatherLights(lantern);
    if (this._censer) { const i = G.dynLights.indexOf(this._censer); if (i >= 0) G.dynLights.splice(i, 1); }
    // occluders: nearest creatures cast shadows
    const occ = this.occ; occ.length = 0;
    const cands = G.enemies.filter(e => !e.dead && !(e.type === 'mourner' && e.state === 'banished')).map(e => [Math.hypot(e.x - cam.x, e.z - cam.z), e]).sort((a, b) => a[0] - b[0]);
    if (G.boss && !G.boss.dead) cands.unshift([0, G.boss]);
    for (const e of G.enemies) e.occIdx = null; if (G.boss) G.boss.occIdx = null;
    for (const [d, e] of cands) { if (occ.length >= MAXO || d > 22) break; e.occIdx = occ.length; occ.push({ x: e.x, z: e.z, r: e.radius * (e.scale || 1) * (e.type === 'boss' ? 0.9 : 0.85), h: (e.y || 0) + e.height * (e.scale || 1) * (e.type === 'crawler' ? 0.6 : 0.92) }); }
    R.setOccluders(occ);
    R.beginScene();
    for (const m of L.chunks) if (R.aabbVisible(m.bounds, 0.5)) R.draw(m, null);
    if (G.decalMesh) { const gl = R.gl; gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(-1, -2); R.draw(G.decalMesh, null); gl.disable(gl.POLYGON_OFFSET_FILL); }
    safeEach(G.ents, e => { if (e.draw && R.sphereVisible(e.x, 1, e.z, 2)) e.draw(); }, e => { e.dead = true; });
    safeEach(G.enemies, e => { if (R.sphereVisible(e.x, 1.2, e.z, 2.5 * (e.scale || 1))) e.draw(); }, e => { e.dead = true; e.remove = true; });
    safeEach(G.phantoms, e => { if (R.sphereVisible(e.x, 1.2, e.z, 2)) e.draw(); }, e => { e.dead = true; });
    if (G.boss) G.boss.draw();
    safeEach(G.projs, p => p.draw(), p => { p.dead = true; });
    if (this.state === 'title') this.drawTitleFigure();
    drawStaticFlames();
    // owl feather: sense foes through walls
    if (G.P && G.P.fx.sense) for (const e of G.enemies) if (!e.dead && !e.dormant && Math.hypot(e.x - G.P.x, e.z - G.P.z) < 16 && !G.L.los(G.P.x, G.P.z, e.x, e.z)) R.sprite(e.x, 1.4, e.z, 0.4, 0.6, 0.15, 0.05, 0.5 + 0.2 * Math.sin(G.t * 5), SPR.GLOW, 0, 0, 1);
    Parts.emit();
    R.flushSprites(lantern || { x: 0, y: -99, z: 0, r: 0.01, cr: 0, cg: 0, cb: 0 });
    if (G.P && this.state !== 'title' && !G.P.dead) { R.beginViewmodel(); G.P.drawViewmodel(R.camM); }
    R.endScene();
  },
  drawTitleFigure() {
    const f = this.titleFig; if (!f.show) return;
    const rig = RIGS.hollow; if (!f.pose) f.pose = rig.pose();
    const j = rig.j; f.pose[j.head][2] = 0.4 + Math.sin(G.t * 7) * 0.05 * (Math.random() < 0.05 ? 8 : 1); f.pose[j.torso][0] = 0.3; f.pose[j.armL][0] = -0.3; f.pose[j.armR][0] = -0.2;
    M4.identity(tmpM); M4.translate(tmpM, f.x, 0, f.z); M4.rotateY(tmpM, 0);
    const root = M4.create(); M4.copy(root, tmpM); rig.draw(root, f.pose, [0.8, 0.8, 0.8, 0.15], null, -1);
  },
};

/* expose for testing / debugging */
window.TALLOW = { Game, G, R, Gen, Meta, SETTINGS, UI };
Game.boot().catch(e => { console.error(e); fatal('The Tallow Deep failed to start.', String(e && e.stack || e)); });
</script>
