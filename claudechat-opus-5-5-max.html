<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASHGRAVE — A Descent by Lanternlight</title>
<meta name="description" content="ASHGRAVE: a first-person horror roguelike RPG. Descend beneath a ruined abbey by lanternlight. Every descent is different. Death is not the end.">
<meta name="theme-color" content="#0b0807">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0807'/%3E%3Cpath d='M32 8c6 10 14 16 14 28a14 14 0 0 1-28 0c0-8 5-12 8-18 2 6 6 8 6 8s-3-8 0-18z' fill='%23e8a04a'/%3E%3Cpath d='M32 30c3 5 6 7 6 12a6 6 0 0 1-12 0c0-4 3-6 6-12z' fill='%23fff1c8'/%3E%3C/svg%3E">
<style>:root {
  --ink: #e9dfcc; --dim: #a89c88; --faint: #6d6455; --ember: #e8a04a; --ember2: #ffcf7a; --blood: #b3261e; --mind: #8a7fd6; --gold: #e0b050;
  --panel: rgba(12, 9, 8, 0.86); --line: rgba(232, 160, 74, 0.22); --serif: "Cormorant Garamond", "EB Garamond", Garamond, "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050403; overflow: hidden; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#gl { image-rendering: pixelated; cursor: none; }
#ov { pointer-events: none; }
.off { display: none !important; }
button { font-family: var(--serif); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 3; pointer-events: none; font-size: 15px; text-shadow: 0 1px 2px #000, 0 0 8px #000; }
#hud.flicker { animation: hudflick 0.13s steps(2) infinite; }
@keyframes hudflick { 50% { opacity: 0.55; transform: translateX(1px); } }
#hud-tl { position: absolute; left: 28px; top: 22px; }
#floorName { font-size: 17px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ember2); }
#objective { margin-top: 4px; color: var(--dim); font-style: italic; font-size: 16px; }
#objective.bells { color: #d9776a; }
#hud-tr { position: absolute; right: 28px; top: 22px; text-align: right; }
.res { font-size: 18px; letter-spacing: 0.06em; margin-bottom: 3px; display: flex; align-items: center; justify-content: flex-end; gap: 7px; }
.res svg { width: 18px; height: 18px; }
#keyIcon { margin-top: 6px; color: #9fe0b0; font-size: 15px; letter-spacing: 0.1em; display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
#keyIcon svg { width: 22px; height: 22px; }
#bars { position: absolute; left: 28px; bottom: 36px; width: 290px; }
.bar { position: relative; height: 16px; margin-top: 8px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(233, 223, 204, 0.16); overflow: hidden; }
.bar .fill, .bar .ghost { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left center; }
.bar .ghost { background: rgba(255, 240, 220, 0.35); transition: transform 0.6s ease 0.25s; }
.bar.hp .fill { background: linear-gradient(180deg, #c3382d, #6e1510); }
.bar.san .fill { background: linear-gradient(180deg, #8f84e0, #3b3378); }
.bar.sta { height: 5px; border: none; background: rgba(0, 0, 0, 0.5); }
.bar.sta .fill { background: linear-gradient(90deg, #a89c88, #e9dfcc); }
.bar.sta.low .fill { background: #8a5a3a; }
.bar .lbl { position: absolute; left: 7px; top: -1px; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.82); }
.bar .val { position: absolute; right: 7px; top: -1px; font-size: 13px; color: rgba(255, 255, 255, 0.88); }
.bar.san.crit { animation: pulse 0.8s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 12px #8a7fd6; } }
#hotbar { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 8px; }
.slot { position: relative; width: 56px; height: 56px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(233, 223, 204, 0.14); display: flex; align-items: center; justify-content: center; }
.slot svg { width: 34px; height: 34px; opacity: 0.92; }
.slot .k { position: absolute; left: 4px; top: 1px; font-size: 12px; color: var(--faint); }
.slot .c { position: absolute; right: 4px; bottom: 1px; font-size: 15px; color: var(--ink); }
.slot.empty svg { opacity: 0.2; } .slot.empty .c { color: var(--faint); }
.slot.using { border-color: var(--ember); box-shadow: 0 0 10px rgba(232, 160, 74, 0.5); }
#lanternBox { position: absolute; right: 30px; bottom: 34px; display: flex; align-items: flex-end; gap: 10px; }
#lanternIcon svg { width: 46px; height: 46px; }
#oilTrack { width: 12px; height: 70px; background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(233, 223, 204, 0.16); position: relative; }
#oilFill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(0deg, #8a4a10, #f0b050); transform-origin: bottom; }
#oilVal { font-size: 14px; color: var(--dim); width: 34px; }
#lanternBox .hint { position: absolute; right: -4px; top: -18px; font-size: 12px; color: var(--faint); }
#lanternBox.out #lanternIcon { opacity: 0.35; }
#lanternBox.low #oilFill { animation: pulse2 0.6s infinite; }
@keyframes pulse2 { 50% { opacity: 0.3; } }
#weaponInfo { position: absolute; right: 30px; bottom: 120px; text-align: right; font-size: 15px; color: var(--dim); max-width: 340px; }
#weaponInfo b { color: var(--ink); font-weight: 600; letter-spacing: 0.04em; }
#xpbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, 0.6); }
#xpbar .fill { height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, #6a4a1a, var(--ember)); }
#lvl { position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.25em; color: var(--faint); }
#crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 240, 220, 0.55); box-shadow: 0 0 3px #000; }
#crosshair.hit { transform: scale(2.2); background: #ffd9a0; transition: transform 0.05s; }
#prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); padding: 7px 16px; background: rgba(8, 6, 5, 0.72); border: 1px solid var(--line); font-size: 17px; white-space: nowrap; }
#prompt kbd, .kbd { display: inline-block; min-width: 22px; padding: 0 6px; margin-right: 6px; border: 1px solid rgba(233, 223, 204, 0.4); border-radius: 3px; font-family: var(--serif); font-size: 14px; text-align: center; color: var(--ember2); }
#prompt .sub { display: block; font-size: 14px; color: var(--dim); text-align: center; margin-top: 2px; }
#bossbar { position: absolute; left: 50%; top: 34px; width: min(640px, 70vw); transform: translateX(-50%); text-align: center; }
#bossbar .name { font-size: 20px; letter-spacing: 0.3em; text-transform: uppercase; color: #f0c8a0; margin-bottom: 6px; }
#bossbar .track { position: relative; height: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(232, 160, 74, 0.35); overflow: hidden; }
#bossbar .fill, #bossbar .ghost { position: absolute; inset: 0; transform-origin: left; }
#bossbar .ghost { background: rgba(255, 220, 180, 0.4); transition: transform 0.8s ease 0.3s; }
#bossbar .fill { background: linear-gradient(180deg, #d8432f, #6d140c); }
#status { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 18px; letter-spacing: 0.3em; text-transform: uppercase; color: #b9a6ff; opacity: 0; transition: opacity 0.6s; }
#status.on { opacity: 0.85; }
#status.mad { color: #e05a4a; animation: pulse2 0.5s infinite; }
#toasts { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast { padding: 5px 16px; background: rgba(8, 6, 5, 0.62); border-left: 2px solid var(--ember); font-size: 17px; opacity: 0; transform: translateY(-6px); transition: opacity 0.35s, transform 0.35s; white-space: nowrap; }
.toast.in { opacity: 1; transform: none; }
.toast.gold { border-color: var(--gold); color: #f0d48a; }
.toast.warn { border-color: var(--blood); color: #f0b0a0; }
.toast.relic { border-color: #e0b050; color: #ffe2a8; font-size: 18px; }
.toast.parry { border-color: #fff; color: #fff; letter-spacing: 0.2em; text-transform: uppercase; font-size: 15px; }
.toast.lore { border-color: #9fa8c0; font-style: italic; }
#caption { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); font-size: 16px; color: #d8d0c0; font-style: italic; opacity: 0; transition: opacity 0.4s; background: rgba(0, 0, 0, 0.5); padding: 2px 10px; }
#caption.on { opacity: 1; }
#help { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; max-width: 900px; padding: 10px 18px; background: rgba(8, 6, 5, 0.6); border: 1px solid rgba(232, 160, 74, 0.18); font-size: 15px; color: var(--dim); transition: opacity 1.2s; }
#help span { white-space: nowrap; } #help b { color: var(--ember2); font-weight: 500; margin-right: 5px; }
#help.fade { opacity: 0; }
.touchnote { margin-top: 14px; color: #f0b0a0; font-size: 16px; }

/* ---------- floor card ---------- */
#floorCard { position: absolute; z-index: 4; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; animation: card 4.6s ease forwards; text-shadow: 0 2px 12px #000; }
#floorCard .n { font-size: 15px; letter-spacing: 0.5em; color: var(--dim); text-transform: uppercase; }
#floorCard .t { font-size: clamp(34px, 5vw, 58px); letter-spacing: 0.08em; color: var(--ink); margin: 10px 0 6px; }
#floorCard .s { font-size: 19px; font-style: italic; color: var(--dim); }
@keyframes card { 0% { opacity: 0; letter-spacing: 0.3em; } 18% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- screens ---------- */
#screens { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; background: radial-gradient(ellipse at center, rgba(10, 7, 6, 0.55), rgba(3, 2, 2, 0.93)); animation: fadein 0.35s ease; }
.screen.on { display: flex; }
.screen.clear { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 30%, rgba(3, 2, 2, 0.75)); }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.panel { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 30px 38px; max-width: min(920px, 94vw); max-height: 92vh; overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 0 60px rgba(0, 0, 0, 0.5); }
.panel::before, .panel::after { content: ""; position: absolute; width: 18px; height: 18px; border: 1px solid var(--ember); opacity: 0.5; }
.panel::before { left: -1px; top: -1px; border-right: none; border-bottom: none; }
.panel::after { right: -1px; bottom: -1px; border-left: none; border-top: none; }
h1, h2, h3 { font-weight: 500; margin: 0; }
h2 { font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ember2); text-align: center; margin-bottom: 6px; }
.sub { text-align: center; color: var(--dim); font-style: italic; margin-bottom: 22px; font-size: 17px; }
.menu { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.btn { position: relative; background: none; border: none; color: var(--ink); font-size: 22px; letter-spacing: 0.12em; padding: 7px 26px; cursor: pointer; transition: color 0.15s, text-shadow 0.15s; outline: none; }
.btn::before { content: "✦"; position: absolute; left: 2px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--ember); opacity: 0; transition: opacity 0.15s; }
.btn:hover, .btn.focus, .btn:focus-visible { color: var(--ember2); text-shadow: 0 0 14px rgba(232, 160, 74, 0.55); }
.btn:hover::before, .btn.focus::before, .btn:focus-visible::before { opacity: 1; }
.btn[disabled] { color: var(--faint); cursor: default; text-shadow: none; }
.btn.small { font-size: 17px; padding: 5px 16px; }
.btn.boxed { border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); }
.btn.boxed:hover, .btn.boxed.focus { border-color: var(--ember); }
.row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }

/* title */
#scr-title { background: linear-gradient(90deg, rgba(3, 2, 2, 0.88) 0%, rgba(3, 2, 2, 0.55) 38%, rgba(0, 0, 0, 0) 62%), radial-gradient(ellipse at 70% 55%, rgba(0, 0, 0, 0) 25%, rgba(3, 2, 2, 0.7) 80%); flex-direction: column; align-items: flex-start !important; justify-content: center; padding-left: 7vw; }
#scr-title .menu { align-items: flex-start; }
#scr-title .btn { padding-left: 22px; }
#scr-title .btn::before { left: 0; }
.logo { font-size: clamp(48px, 7.4vw, 104px); letter-spacing: 0.2em; font-weight: 500; color: #efe3cc; text-shadow: 0 0 30px rgba(232, 160, 74, 0.35), 0 4px 18px #000; margin-right: -0.22em; animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 50% { text-shadow: 0 0 46px rgba(232, 160, 74, 0.55), 0 4px 18px #000; } }
.tagline { font-style: italic; color: var(--dim); font-size: 21px; letter-spacing: 0.12em; margin: 4px 0 40px 4px; }
.titlefoot { position: absolute; bottom: 18px; left: 7vw; right: 0; text-align: left; color: var(--faint); font-size: 14px; letter-spacing: 0.1em; }
.embers-badge { color: var(--ember2); font-size: 17px; letter-spacing: 0.1em; margin-top: 26px; display: flex; gap: 8px; align-items: center; }
.embers-badge svg { width: 18px; height: 18px; }

/* story */
.story { max-width: 640px; font-size: 22px; line-height: 1.6; color: #ddd2bd; text-align: center; }
.story p { margin: 0 0 18px; opacity: 0; animation: rise 1.2s ease forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* cards */
.cards { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.card { width: 230px; min-height: 250px; padding: 22px 18px 18px; background: linear-gradient(180deg, rgba(30, 22, 18, 0.95), rgba(14, 10, 9, 0.95)); border: 1px solid rgba(233, 223, 204, 0.18); text-align: center; cursor: pointer; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; align-items: center; outline: none; color: var(--ink); }
.card:hover, .card.focus, .card:focus-visible { transform: translateY(-6px); border-color: var(--ember); box-shadow: 0 10px 30px rgba(232, 160, 74, 0.2); }
.card .rar { font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 14px; }
.card .glyph { width: 64px; height: 64px; margin-bottom: 14px; }
.card .nm { font-size: 22px; margin-bottom: 10px; }
.card .ds { font-size: 16px; color: var(--dim); line-height: 1.4; }
.card .owned { margin-top: auto; padding-top: 10px; font-size: 13px; color: var(--faint); }
.card.cursed { border-color: rgba(224, 90, 74, 0.45); background: linear-gradient(180deg, rgba(40, 14, 12, 0.95), rgba(14, 8, 8, 0.95)); }

/* lists */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.sect { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--faint); margin: 16px 0 8px; border-bottom: 1px solid rgba(233, 223, 204, 0.08); padding-bottom: 4px; }
.stat { display: flex; justify-content: space-between; font-size: 17px; padding: 2px 0; }
.stat span:last-child { color: var(--ember2); }
.tag { display: inline-block; padding: 2px 9px; margin: 3px 4px 3px 0; border: 1px solid rgba(233, 223, 204, 0.18); font-size: 15px; }
.tag.r1 { border-color: rgba(127, 179, 224, 0.5); color: #b8d6f0; } .tag.r2 { border-color: rgba(224, 90, 74, 0.55); color: #f0b0a0; }
.tag.relic { border-color: rgba(224, 176, 80, 0.5); color: #f0d48a; }
.muted { color: var(--faint); font-style: italic; }
.rite { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(233, 223, 204, 0.07); }
.rite .nm { font-size: 19px; }
.rite .ds { font-size: 15px; color: var(--dim); }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pip { width: 10px; height: 10px; border: 1px solid var(--ember); transform: rotate(45deg); }
.pip.on { background: var(--ember); box-shadow: 0 0 6px var(--ember); }
.cost { display: flex; align-items: center; gap: 5px; color: var(--ember2); font-size: 17px; }
.cost svg { width: 15px; height: 15px; }

/* merchant */
.wares { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.ware { padding: 14px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(233, 223, 204, 0.12); display: flex; flex-direction: column; gap: 6px; }
.ware .nm { font-size: 18px; } .ware .ds { font-size: 14px; color: var(--dim); flex: 1; }
.ware.sold { opacity: 0.35; }

/* note */
.parch { max-width: 560px; padding: 44px 48px; background: radial-gradient(ellipse at 40% 30%, #d8c59c, #b29a6a 80%); color: #2a1d10; font-size: 21px; line-height: 1.55; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 70px rgba(80, 50, 20, 0.6); font-style: italic; transform: rotate(-0.6deg); }
.parch h3 { font-style: normal; font-size: 24px; letter-spacing: 0.08em; margin-bottom: 16px; color: #3a2410; }
.parch .close { margin-top: 22px; font-size: 15px; color: #5a4020; text-align: right; font-style: normal; }

/* settings */
.set { display: grid; grid-template-columns: 210px 1fr 60px; align-items: center; gap: 14px; padding: 6px 0; font-size: 17px; }
.set input[type=range] { width: 100%; accent-color: var(--ember); }
.set .v { color: var(--ember2); text-align: right; font-size: 15px; }
.toggle { width: 44px; height: 22px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.4); position: relative; cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: var(--faint); transition: left 0.15s, background 0.15s; }
.toggle.on::after { left: 25px; background: var(--ember); }
select { background: #140f0c; color: var(--ink); border: 1px solid var(--line); font-family: var(--serif); font-size: 16px; padding: 3px 6px; }
input[type=text] { background: #140f0c; color: var(--ink); border: 1px solid var(--line); font-family: var(--serif); font-size: 17px; padding: 4px 8px; width: 160px; }
table.ctl { border-collapse: collapse; font-size: 17px; }
table.ctl td { padding: 5px 14px; border-bottom: 1px solid rgba(233, 223, 204, 0.06); }
table.ctl td:first-child { color: var(--ember2); text-align: right; white-space: nowrap; }

/* death / victory */
.dead-title { font-size: clamp(40px, 7vw, 80px); letter-spacing: 0.18em; color: #c8402e; text-shadow: 0 0 30px rgba(200, 40, 20, 0.45); text-align: center; animation: rise 2s ease; }
.endstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 30px; margin: 26px auto 10px; max-width: 640px; }
.endstats div { text-align: center; } .endstats b { display: block; font-size: 26px; color: var(--ember2); font-weight: 500; } .endstats span { font-size: 13px; letter-spacing: 0.2em; color: var(--faint); text-transform: uppercase; }
.ending { max-width: 640px; font-size: 21px; line-height: 1.65; text-align: center; color: #ddd2bd; }

#resume { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); padding: 8px 18px; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--line); font-size: 18px; letter-spacing: 0.1em; cursor: pointer; }
#loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050403; z-index: 50; transition: opacity 0.8s; }
#loading .lt { font-size: 54px; letter-spacing: 0.3em; color: #e9dfcc; margin-right: -0.3em; }
#loading .lbar { width: 260px; height: 2px; background: #1a1410; margin-top: 26px; }
#loading .lfill { height: 100%; width: 0; background: var(--ember); transition: width 0.2s; }
#loading .lmsg { margin-top: 14px; font-style: italic; color: var(--faint); }
#loading.done { opacity: 0; pointer-events: none; }
.noscript, .fatal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 22px; background: #050403; color: var(--ink); z-index: 60; line-height: 1.6; }
.warnline { color: #f0b0a0; font-size: 15px; text-align: center; margin-top: 10px; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #3a2c20; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } #bars { width: 200px; } .slot { width: 44px; height: 44px; } .endstats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="Game view"></canvas>
  <canvas id="ov" aria-hidden="true"></canvas>
  <div id="hud" class="off" aria-live="polite">
    <div id="hud-tl"><div id="floorName"></div><div id="objective"></div></div>
    <div id="hud-tr"><div id="goldV" class="res"></div><div id="emberV" class="res"></div><div id="keyIcon" class="off"></div></div>
    <div id="bars">

    r = lerp(0.07, r, seam); g = lerp(0.065, g, seam); b = lerp(0.06, b, seam);
    if (crack > 0.9) { r *= 0.6; g *= 0.6; b *= 0.6; }
    const dirt = smoothstep(0.5, 0.75, fbm(u * 4 + 9, v * 4, 4, 4, 12));
    r = lerp(r, 0.13, dirt * 0.5); g = lerp(g, 0.11, dirt * 0.5); b = lerp(b, 0.09, dirt * 0.5);
    set(i, r + fine * 0.03, g + fine * 0.03, b + fine * 0.03, h + fine * 0.05, 0.8 - (1 - seam) * 0.2);
  });
  // 2 STONE_CEIL — rough vaulted stone
  L[MAT.STONE_CEIL] = () => each((u, v, i) => {
    const b = brick(u, v, 4, 2, 0.5, 0.05, 101);
    const n = fbm(u * 6, v * 6, 6, 5, 17);
    const tone = 0.55 + b.id * 0.25 + (n - 0.5) * 0.5;
    const soot = smoothstep(0.35, 0.8, fbm(u * 2, v * 2, 2, 4, 55));
    let r = 0.28 * tone, g = 0.255 * tone, bl = 0.23 * tone;
    if (b.m) { r = g = bl = 0.08; }
    r *= 1 - soot * 0.6; g *= 1 - soot * 0.6; bl *= 1 - soot * 0.58;
    set(i, r, g, bl, (b.m ? 0.1 : 0.5) + n * 0.4, 0.95);
  });
  // 3 CRYPT_WALL — big wet blocks, moss, slime streaks
  L[MAT.CRYPT_WALL] = () => each((u, v, i) => {
    const b = brick(u, v, 4, 2, 0.5, 0.045, 201);
    const n = fbm(u * 8, v * 8, 8, 4, 23), fine = vnoise(u * 64, v * 64, 64, 29);
    const streak = fbm(u * 24, v * 2, 24, 3, 31);
    const moss = smoothstep(0.55, 0.72, fbm(u * 5, v * 5, 5, 5, 37));
    const tone = 0.7 + b.id * 0.3 + (n - 0.5) * 0.4;
    let r = 0.20 * tone, g = 0.235 * tone, bl = 0.225 * tone;
    if (b.m) { r = 0.06; g = 0.075; bl = 0.07; }
    const wet = smoothstep(0.45, 0.7, streak);
    r *= 1 - wet * 0.4; g *= 1 - wet * 0.3; bl *= 1 - wet * 0.3;
    r = lerp(r, 0.10, moss); g = lerp(g, 0.17, moss); bl = lerp(bl, 0.07, moss);
    set(i, r + fine * 0.02, g + fine * 0.02, bl + fine * 0.02, (b.m ? 0.1 : 0.55 + smoothstep(0, 0.12, b.edge) * 0.25) + n * 0.15 + moss * 0.1, lerp(0.75, 0.3, wet) + moss * 0.4);
  });
  // 4 CRYPT_FLOOR — wet cobbles with puddles
  L[MAT.CRYPT_FLOOR] = () => each((u, v, i) => {
    const w = worley(u * 6, v * 6, 6, 61, 0.9);
    const gap = w.f2 - w.f1;
    const n = fbm(u * 10, v * 10, 10, 4, 63);
    const puddle = smoothstep(0.52, 0.6, fbm(u * 3, v * 3, 3, 4, 67));
    const seam = smoothstep(0.04, 0.12, gap);
    const tone = 0.65 + w.id * 0.4 + (n - 0.5) * 0.3;
    let r = 0.17 * tone, g = 0.19 * tone, b = 0.18 * tone;
    r = lerp(0.04, r, seam); g = lerp(0.05, g, seam); b = lerp(0.045, b, seam);
    r = lerp(r, 0.035, puddle); g = lerp(g, 0.045, puddle); b = lerp(b, 0.05, puddle);
    const h = lerp(seam * 0.7 + n * 0.25, 0.45, puddle);
    set(i, r, g, b, h, lerp(lerp(0.85, 0.45, 0.5), 0.05, puddle));
  });
  // 5 BRICK_WALL — small dark red bricks with flesh veins
  L[MAT.BRICK_WALL] = () => each((u, v, i) => {
    const b = brick(u, v, 8, 4, 0.5, 0.09, 301);
    const n = fbm(u * 8, v * 8, 8, 4, 71), fine = vnoise(u * 64, v * 64, 64, 73);
    const vein = ridged(u * 5, v * 5, 5, 4, 79);
    const tone = 0.7 + b.id * 0.45 + (n - 0.5) * 0.3;
    let r = 0.36 * tone, g = 0.13 * tone, bl = 0.10 * tone;
    if (b.m) { r = 0.05; g = 0.03; bl = 0.03; }
    const vm = smoothstep(0.82, 0.95, vein);
    r = lerp(r, 0.45, vm); g = lerp(g, 0.05, vm); bl = lerp(bl, 0.07, vm);
    set(i, r + fine * 0.03, g + fine * 0.02, bl + fine * 0.02, (b.m ? 0.15 : 0.6 + smoothstep(0, 0.2, b.edge) * 0.2) + vm * 0.3 + fine * 0.05, 0.8 - vm * 0.5);
  });
  // 6 FLESH_FLOOR — stone overtaken by growth
  L[MAT.FLESH_FLOOR] = () => each((u, v, i) => {
    const w = worley(u * 4, v * 4, 4, 81, 0.8);
    const seam = smoothstep(0.03, 0.1, w.f2 - w.f1);
    const n = fbm(u * 8, v * 8, 8, 4, 83);
    const vein = ridged(u * 6, v * 6, 6, 4, 85);
    const flesh = smoothstep(0.45, 0.65, fbm(u * 3, v * 3, 3, 4, 87));
    let r = 0.22 * (0.7 + w.id * 0.4), g = 0.15 * (0.7 + w.id * 0.4), b = 0.13 * (0.7 + w.id * 0.4);
    r = lerp(0.05, r, seam); g = lerp(0.03, g, seam); b = lerp(0.03, b, seam);
    const fr = 0.32 + n * 0.12, fg = 0.09 + n * 0.04, fb = 0.09 + n * 0.04;
    r = lerp(r, fr, flesh); g = lerp(g, fg, flesh); b = lerp(b, fb, flesh);
    const vm = smoothstep(0.8, 0.95, vein) * (0.4 + flesh);
    r = lerp(r, 0.5, vm * 0.6); g = lerp(g, 0.06, vm * 0.6); b = lerp(b, 0.1, vm * 0.6);
    set(i, r, g, b, seam * 0.5 + flesh * 0.3 + vm * 0.25 + n * 0.1, lerp(0.85, 0.35, flesh));
  });
  // 7 WOOD
  L[MAT.WOOD] = () => each((u, v, i) => {
    const planks = 4, pu = u * planks, p = Math.floor(pu), fx = pu - p;
    const id = hash2(p, 0, 91);
    const grain = Math.sin((v * 40 + fbm(u * 4, v * 2, 4, 3, 93 + p) * 6 + id * 10) * 2.0) * 0.5 + 0.5;
    const knot = smoothstep(0.85, 0.95, fbm(u * 8, v * 4, 8, 3, 95 + p));
    const gap = smoothstep(0.0, 0.05, Math.min(fx, 1 - fx));
    const tone = (0.55 + id * 0.35) * (0.8 + grain * 0.25) * (1 - knot * 0.4);
    let r = 0.28 * tone, g = 0.18 * tone, b = 0.10 * tone;
    r = lerp(0.03, r, gap); g = lerp(0.02, g, gap); b = lerp(0.015, b, gap);
    const nail = (Math.hypot(fx - 0.5, ((v * 4) % 1) - 0.12) < 0.05) ? 1 : 0;
    if (nail) { r = 0.1; g = 0.09; b = 0.08; }
    set(i, r, g, b, gap * 0.6 + grain * 0.15 - knot * 0.1 + nail * 0.2, 0.75);
  });
  // 8 IRON — dark rusted iron
  L[MAT.IRON] = () => each((u, v, i) => {
    const n = fbm(u * 6, v * 6, 6, 5, 101);
    const rust = smoothstep(0.45, 0.7, fbm(u * 4, v * 4, 4, 5, 103));
    const scratch = smoothstep(0.92, 0.99, ridged(u * 2, v * 16, 2, 2, 107));
    let r = 0.16 + n * 0.06, g = 0.16 + n * 0.06, b = 0.17 + n * 0.06;
    r = lerp(r, 0.32, rust); g = lerp(g, 0.15, rust); b = lerp(b, 0.07, rust);
    r += scratch * 0.15; g += scratch * 0.15; b += scratch * 0.15;
    set(i, r, g, b, n * 0.3 + rust * 0.3, lerp(0.35, 0.9, rust));
  });
  // 9 BONE
  L[MAT.BONE] = () => each((u, v, i) => {
    const n = fbm(u * 8, v * 8, 8, 4, 111);
    const w = worley(u * 16, v * 16, 16, 113, 1);
    const pore = smoothstep(0.12, 0.05, w.f1);
    const stain = smoothstep(0.5, 0.8, fbm(u * 3, v * 3, 3, 4, 117));
    let r = 0.72 + n * 0.1, g = 0.66 + n * 0.1, b = 0.54 + n * 0.08;
    r = lerp(r, 0.42, stain); g = lerp(g, 0.34, stain); b = lerp(b, 0.22, stain);
    r -= pore * 0.25; g -= pore * 0.25; b -= pore * 0.22;
    set(i, r, g, b, n * 0.4 - pore * 0.3, 0.6);
  });
  // 10 SKIN — pale dead flesh (tinted per creature)
  L[MAT.SKIN] = () => each((u, v, i) => {
    const n = fbm(u * 6, v * 6, 6, 5, 121);
    const blot = smoothstep(0.55, 0.75, fbm(u * 4, v * 4, 4, 4, 123));
    const vein = smoothstep(0.86, 0.97, ridged(u * 4, v * 4, 4, 4, 127));
    let r = 0.50 + n * 0.14, g = 0.48 + n * 0.12, b = 0.45 + n * 0.11;
    const grime = smoothstep(0.4, 0.75, fbm(u * 2, v * 2, 2, 4, 125));
    r = lerp(r, 0.26, blot); g = lerp(g, 0.22, blot); b = lerp(b, 0.22, blot);
    r *= 1 - grime * 0.55; g *= 1 - grime * 0.6; b *= 1 - grime * 0.6;
    const sore = smoothstep(0.7, 0.85, fbm(u * 7, v * 7, 7, 3, 129)); r = lerp(r, 0.3, sore * 0.7); g = lerp(g, 0.08, sore * 0.7); b = lerp(b, 0.07, sore * 0.7);
    r = lerp(r, 0.30, vein); g = lerp(g, 0.25, vein); b = lerp(b, 0.40, vein);
    set(i, r, g, b, n * 0.5 + vein * 0.2 - blot * 0.1, 0.55);
  });
  // 11 CLOTH — coarse woven fabric
  L[MAT.CLOTH] = () => each((u, v, i) => {
    const wu = Math.sin(u * TAU * 32) * 0.5 + 0.5, wv = Math.sin(v * TAU * 32) * 0.5 + 0.5;
    const weave = ((Math.floor(u * 32) + Math.floor(v * 32)) % 2) ? wu : wv;
    const n = fbm(u * 6, v * 6, 6, 4, 131);
    const tear = smoothstep(0.7, 0.75, fbm(u * 5, v * 5, 5, 4, 133));
    const tone = 0.6 + n * 0.5 + weave * 0.15;
    set(i, 0.22 * tone, 0.20 * tone, 0.18 * tone, weave * 0.4 + n * 0.3 - tear * 0.3, 0.95);
    if (tear > 0.5) { C[i * 3] *= 0.3; C[i * 3 + 1] *= 0.3; C[i * 3 + 2] *= 0.3; }
  });
  // 12 WAX
  L[MAT.WAX] = () => each((u, v, i) => {
    const n = fbm(u * 4, v * 8, 4, 4, 141);
    const drip = smoothstep(0.6, 0.8, fbm(u * 12, v * 1.5, 12, 2, 143));
    set(i, 0.80 + n * 0.08, 0.74 + n * 0.08, 0.58 + n * 0.06, n * 0.3 + drip * 0.3, 0.35);
  });
  // 13 BRASS
  L[MAT.BRASS] = () => each((u, v, i) => {
    const n = fbm(u * 6, v * 6, 6, 4, 151);
    const tarnish = smoothstep(0.45, 0.75, fbm(u * 3, v * 3, 3, 5, 153));
    let r = 0.62 + n * 0.1, g = 0.46 + n * 0.08, b = 0.20 + n * 0.05;
    r = lerp(r, 0.22, tarnish); g = lerp(g, 0.26, tarnish); b = lerp(b, 0.18, tarnish);
    set(i, r, g, b, n * 0.2, lerp(0.25, 0.75, tarnish));
  });
  // 14 STATUE — weathered pale stone
  L[MAT.STATUE] = () => each((u, v, i) => {
    const n = fbm(u * 5, v * 5, 5, 5, 161), fine = vnoise(u * 48, v * 48, 48, 163);
    const crack = smoothstep(0.9, 0.97, ridged(u * 3, v * 3, 3, 4, 167));
    const moss = smoothstep(0.62, 0.78, fbm(u * 4, v * 4, 4, 4, 169));
    let r = 0.55 + n * 0.12, g = 0.54 + n * 0.12, b = 0.52 + n * 0.11;
    r -= crack * 0.35; g -= crack * 0.35; b -= crack * 0.35;
    r = lerp(r, 0.2, moss); g = lerp(g, 0.25, moss); b = lerp(b, 0.15, moss);
    set(i, r + fine * 0.04, g + fine * 0.04, b + fine * 0.04, n * 0.4 - crack * 0.3, 0.8);
  });
  // 15 BLOOD — splat decal
  L[MAT.BLOOD] = () => each((u, v, i) => {
    const dx = u - 0.5, dy = v - 0.5, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    const edge = 0.28 + fbm((ang / TAU + 0.5) * 8, d * 2, 8, 3, 171) * 0.18;
    const drops = smoothstep(0.08, 0.04, worley(u * 9, v * 9, 9, 173, 1).f1) * (d > 0.3 ? 1 : 0) * (hash2(Math.floor(u * 9), Math.floor(v * 9), 175) > 0.6 ? 1 : 0);
    const a = Math.max(smoothstep(edge, edge - 0.04, d), drops);
    const n = fbm(u * 8, v * 8, 8, 3, 177);
    set(i, 0.13 + n * 0.06, 0.01, 0.012, a * 0.3 + n * 0.1, 0.12);
    A[i] = a;
  });
  // 16 COBWEB
  L[MAT.COBWEB] = () => each((u, v, i) => {
    const ang = Math.atan2(v, u), d = Math.hypot(u, v);
    const spokes = Math.abs(Math.sin(ang * 9 + fbm(d * 4, ang, 4, 2, 181) * 0.6));
    const rings = Math.abs(Math.sin(d * 34 + Math.sin(ang * 9) * 0.6));
    const a = (smoothstep(0.06, 0.0, spokes) + smoothstep(0.08, 0.0, rings) * 0.8) * smoothstep(1.0, 0.6, d) * (0.6 + vnoise(u * 16, v * 16, 16, 183) * 0.4);
    set(i, 0.75, 0.75, 0.72, 0.5, 0.9);
    A[i] = clamp(a, 0, 1);
  });
  // 17 RUNE — sigil circle (used as emissive)
  L[MAT.RUNE] = () => each((u, v, i) => {
    const dx = u - 0.5, dy = v - 0.5, d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
    let a = 0;
    a = Math.max(a, smoothstep(0.012, 0.0, Math.abs(d - 0.46)));
    a = Math.max(a, smoothstep(0.01, 0.0, Math.abs(d - 0.40)));
    a = Math.max(a, smoothstep(0.012, 0.0, Math.abs(d - 0.22)));
    // star polygon
    for (let k = 0; k < 7; k++) {
      const a1 = (k / 7) * TAU, a2 = ((k + 3) / 7) * TAU;
      const x1 = Math.cos(a1) * 0.4, y1 = Math.sin(a1) * 0.4, x2 = Math.cos(a2) * 0.4, y2 = Math.sin(a2) * 0.4;
      const ex = x2 - x1, ey = y2 - y1, t = clamp(((dx - x1) * ex + (dy - y1) * ey) / (ex * ex + ey * ey), 0, 1);
      const ld = Math.hypot(dx - (x1 + ex * t), dy - (y1 + ey * t));
      a = Math.max(a, smoothstep(0.01, 0.0, ld));
    }
    // glyph ticks between rings
    if (d > 0.405 && d < 0.455) { const g = Math.floor((ang / TAU + 0.5) * 36); if (hash2(g, 0, 187) > 0.45 && Math.abs(Math.sin(ang * 36 * 0.5 * 2)) < 0.5) a = Math.max(a, 0.9); }
    a = Math.min(1, a);
    set(i, 1, 1, 1, a, 0.5);
    A[i] = a;
  });
  // 18 PAPER — parchment with scrawl
  L[MAT.PAPER] = () => each((u, v, i) => {
    const n = fbm(u * 6, v * 6, 6, 4, 191);
    const stain = smoothstep(0.55, 0.8, fbm(u * 3, v * 3, 3, 4, 193));
    const line = Math.floor(v * 14), lf = v * 14 - line;
    const ink = (line > 1 && line < 13 && lf > 0.35 && lf < 0.55 && u > 0.12 && u < 0.88 && vnoise(u * 40, line * 3, 40, 195) > 0.35) ? 1 : 0;
    let r = 0.74 + n * 0.1, g = 0.66 + n * 0.1, b = 0.48 + n * 0.08;
    r = lerp(r, 0.45, stain); g = lerp(g, 0.35, stain); b = lerp(b, 0.22, stain);
    if (ink) { r = 0.12; g = 0.08; b = 0.06; }
    set(i, r, g, b, n * 0.2, 0.9);
  });
  // 19 WHITE
  L[MAT.WHITE] = () => each((u, v, i) => set(i, 1, 1, 1, 0.5, 0.6));
  // 20 VOID
  L[MAT.VOID] = () => each((u, v, i) => set(i, 0.01, 0.008, 0.008, 0.5, 1));
  // 21 WATER — dark still water with ripples
  L[MAT.WATER] = () => each((u, v, i) => {
    const n = fbm(u * 4, v * 4, 4, 4, 201);
    const rip = Math.sin((Math.hypot(u - 0.5, v - 0.5) * 50) + n * 6) * 0.5 + 0.5;
    set(i, 0.02 + n * 0.02, 0.03 + n * 0.02, 0.035 + n * 0.02, rip * 0.15 + n * 0.1, 0.04);
  });
  // 22 GROWTH — fleshy tendrils / cocoon wrap
  L[MAT.GROWTH] = () => each((u, v, i) => {
    const n = fbm(u * 6, v * 3, 6, 5, 211);
    const vein = smoothstep(0.75, 0.95, ridged(u * 8, v * 2, 8, 3, 213));
    let r = 0.40 + n * 0.15, g = 0.12 + n * 0.05, b = 0.12 + n * 0.05;
    r = lerp(r, 0.7, vein * 0.5); g = lerp(g, 0.1, vein * 0.5);
    set(i, r, g, b, n * 0.6 + vein * 0.3, 0.35);
  });
  // 27 SANCTUM WALL — dark marble with gold veins
  L[MAT.SANCT_WALL] = () => each((u, v, i) => {
    const b = brick(u, v, 2, 1, 0.5, 0.025, 401);
    const n = fbm(u * 4 + fbm(u * 8, v * 8, 8, 3, 403) * 0.8, v * 4, 4, 5, 405);
    const vein = smoothstep(0.9, 0.98, ridged(u * 3 + n, v * 3, 3, 4, 407));
    let r = 0.10 + n * 0.08, g = 0.09 + n * 0.07, bl = 0.11 + n * 0.08;
    if (b.m) { r = 0.03; g = 0.025; bl = 0.03; }
    r = lerp(r, 0.55, vein); g = lerp(g, 0.40, vein); bl = lerp(bl, 0.15, vein);
    set(i, r, g, bl, b.m ? 0.1 : 0.6 + n * 0.1, lerp(0.25, 0.3, vein));
  });
  // 28 SANCTUM FLOOR — checkered marble with rune etching
  L[MAT.SANCT_FLOOR] = () => each((u, v, i) => {
    const cu = Math.floor(u * 2), cv = Math.floor(v * 2), chk = (cu + cv) % 2;
    const n = fbm(u * 5 + fbm(u * 9, v * 9, 9, 3, 411), v * 5, 5, 5, 413);
    const fu = (u * 2) % 1, fv = (v * 2) % 1, seam = smoothstep(0.0, 0.02, Math.min(fu, 1 - fu, fv, 1 - fv));
    let r = chk ? 0.36 + n * 0.1 : 0.07 + n * 0.05, g = chk ? 0.33 + n * 0.1 : 0.06 + n * 0.05, b = chk ? 0.30 + n * 0.1 : 0.07 + n * 0.05;
    r *= seam; g *= seam; b *= seam;
    set(i, r, g, b, seam * 0.6 + n * 0.1, 0.3);
  });
  // 29 GLASS (lantern glass, emissive mask driven)
  L[MAT.GLASS] = () => each((u, v, i) => { const n = vnoise(u * 8, v * 8, 8, 421); set(i, 1, 0.85, 0.6, n * 0.2, 0.1); });
  // 30 ROPE
  L[MAT.ROPE] = () => each((u, v, i) => {
    const tw = Math.sin((u * 6 + v * 18) * TAU) * 0.5 + 0.5, n = fbm(u * 8, v * 8, 8, 3, 431);
    const t = 0.6 + tw * 0.4 + n * 0.2;
    set(i, 0.36 * t, 0.29 * t, 0.18 * t, tw * 0.6, 0.95);
  });
  // 31 GOLD (coins, relics)
  L[MAT.GOLD] = () => each((u, v, i) => { const n = fbm(u * 8, v * 8, 8, 3, 441); set(i, 0.85 + n * 0.1, 0.62 + n * 0.08, 0.22, n * 0.3, 0.2); });

  const strengths = { [MAT.STONE_WALL]: 3.5, [MAT.STONE_FLOOR]: 3.0, [MAT.STONE_CEIL]: 3.0, [MAT.CRYPT_WALL]: 3.2, [MAT.CRYPT_FLOOR]: 3.0, [MAT.BRICK_WALL]: 3.0, [MAT.FLESH_FLOOR]: 3.0, [MAT.WOOD]: 2.5, [MAT.IRON]: 1.5, [MAT.BONE]: 2.0, [MAT.SKIN]: 2.2, [MAT.CLOTH]: 2.0, [MAT.WAX]: 1.5, [MAT.BRASS]: 1.2, [MAT.STATUE]: 2.5, [MAT.BLOOD]: 1.0, [MAT.WATER]: 0.8, [MAT.GROWTH]: 3.0, [MAT.SANCT_WALL]: 2.0, [MAT.SANCT_FLOOR]: 1.5 };

  const BRIGHT = { [MAT.STONE_WALL]: 1.25, [MAT.STONE_FLOOR]: 1.3, [MAT.STONE_CEIL]: 1.2, [MAT.CRYPT_WALL]: 1.25, [MAT.CRYPT_FLOOR]: 1.3, [MAT.BRICK_WALL]: 1.15, [MAT.FLESH_FLOOR]: 1.2, [MAT.WOOD]: 1.2, [MAT.SANCT_WALL]: 1.2, [MAT.SANCT_FLOOR]: 1.15 };
  for (let layer = 0; layer < MAT_COUNT; layer++) {
    H.fill(0.5); Rf.fill(0.8); C.fill(0.5); A.fill(1);
    if (layer >= MAT.WRIT0 && layer <= MAT.WRIT3) genWriting(WRITINGS[layer - MAT.WRIT0], layer, S, C, H, Rf, A);
    else if (L[layer]) L[layer]();
    const bm = BRIGHT[layer]; if (bm) for (let i = 0; i < N * 3; i++) C[i] *= bm;
    finish(layer, strengths[layer] || 1.5);
    if (onProgress) onProgress((layer + 1) / MAT_COUNT);
  }
  return { alb, nrm, size: S, layers: MAT_COUNT };
}

// Blood-scrawled wall writing rendered via 2D canvas into the layer buffers.
function genWriting(text, layer, S, C, H, Rf, A) {
  const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, S, S);
  // virtual canvas 2S x S (the decal quad is 2:1), squeezed horizontally

  g.font = `bold ${fs}px Georgia, 'Times New Roman', serif`;
  const rng = new RNG(layer * 7919);
  lines.forEach((ln, li) => {
    const y = S / 2 + (li - (lines.length - 1) / 2) * (fs + 6);

    for (const ch of ln) {
      const w = g.measureText(ch).width;
      g.save(); g.translate(x + w / 2, y + rng.range(-2, 2)); g.rotate(rng.range(-0.12, 0.12)); g.fillText(ch, 0, 0); g.restore();

// ---------------------------------------------------------------------------
// WebGL2 renderer: world shader (multi point lights, normal maps, fog), particles, post-FX
// ---------------------------------------------------------------------------
const MAX_LIGHTS = 16;

const SH_WORLD_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUV;
layout(location=3) in float aMat;
layout(location=4) in float aAO;
uniform mat4 uProj, uView, uModel;
uniform mat3 uNrmMat;
uniform vec2 uSnap;
out vec3 vWorld; out vec3 vNrm; out vec2 vUV; flat out float vMat; out float vAO; out float vDepth;
void main(){
  vec4 wp = uModel * vec4(aPos, 1.0);
  vWorld = wp.xyz;
  vNrm = normalize(uNrmMat * aNrm);
  vUV = aUV; vMat = aMat; vAO = aAO;
  vec4 vp = uView * wp;
  vDepth = -vp.z;
  vec4 cp = uProj * vp;
  if (uSnap.x > 0.0 && cp.w > 0.05) {
    vec3 nd = cp.xyz / cp.w;
    nd.xy = floor(nd.xy * uSnap + 0.5) / uSnap;
    cp.xyz = nd * cp.w;
  }
  gl_Position = cp;
}`;

const SH_WORLD_FS = `#version 300 es
precision highp float;
precision highp sampler2DArray;
in vec3 vWorld; in vec3 vNrm; in vec2 vUV; flat in float vMat; in float vAO; in float vDepth;
uniform sampler2DArray uAlb, uNrmTex;
uniform vec3 uCamPos;
uniform int uNumLights;
uniform vec4 uLightPos[${MAX_LIGHTS}];
uniform vec4 uLightCol[${MAX_LIGHTS}];
uniform vec3 uAmbient;
uniform vec3 uFogColor;
uniform float uFogDensity;
uniform vec4 uTint;
uniform vec3 uEmissive;
uniform float uEmTex;
uniform float uAlphaCut;
uniform float uMatOverride;
uniform float uAdd;
uniform float uUnlit;
uniform float uUVScale;
uniform float uRim;
out vec4 oColor;
mat3 cotangentFrame(vec3 N, vec3 p, vec2 uv){
  vec3 dp1 = dFdx(p), dp2 = dFdy(p);
  vec2 duv1 = dFdx(uv), duv2 = dFdy(uv);
  vec3 dp2perp = cross(dp2, N), dp1perp = cross(N, dp1);
  vec3 T = dp2perp * duv1.x + dp1perp * duv2.x;
  vec3 B = dp2perp * duv1.y + dp1perp * duv2.y;
  float m = max(dot(T,T), dot(B,B));
  float invmax = m > 0.0 ? inversesqrt(m) : 0.0;
  return mat3(T * invmax, B * invmax, N);
}
void main(){
  float layer = uMatOverride >= 0.0 ? uMatOverride : vMat;
  vec2 uv = vUV * uUVScale;
  vec4 alb = texture(uAlb, vec3(uv, layer));
  if (alb.a < uAlphaCut) discard;
  vec3 base = alb.rgb * uTint.rgb;
  float a = alb.a * uTint.a;
  vec3 col;
  float fog = 1.0 - exp(-pow(vDepth * uFogDensity, 2.0));
  if (uUnlit > 0.5) {
    col = uEmissive + base * uEmTex;
    if (uRim > 0.0) {
      vec3 Nn = normalize(vNrm); vec3 Vv = normalize(uCamPos - vWorld);
      float rim = 1.0 - abs(dot(Nn, Vv));
      col *= mix(1.0, rim * rim * 2.2 + 0.08, uRim);
    }
  } else {
    vec4 nr = texture(uNrmTex, vec3(uv, layer));
    vec3 N = normalize(vNrm);
    if (!gl_FrontFacing) N = -N;
    vec3 tn = nr.xyz * 2.0 - 1.0;
    mat3 TBN = cotangentFrame(N, vWorld, uv);
    vec3 Np = tn.z > 0.999 ? N : normalize(TBN * tn);
    if (dot(Np, Np) < 0.5) Np = N;
    float rough = nr.a;
    vec3 V = normalize(uCamPos - vWorld);
    col = uAmbient * base * vAO;
    float shin = mix(80.0, 6.0, rough);
    float specAmt = (1.0 - rough) * 0.9;
    for (int i = 0; i < ${MAX_LIGHTS}; i++) {
      if (i >= uNumLights) break;
      vec3 Lv = uLightPos[i].xyz - vWorld;
      float d2 = dot(Lv, Lv);
      float r = uLightPos[i].w;
      if (d2 > r * r) continue;
      float d = sqrt(d2);
      vec3 L = Lv / max(d, 0.0001);
      float x = d / r;
      float win = clamp(1.0 - x * x * x * x, 0.0, 1.0); win *= win;
      float att = win / (1.0 + d2 * 0.12);
      float ndl = max(dot(Np, L), 0.0);
      float wrapN = max(dot(N, L) * 0.5 + 0.5, 0.0);
      float diff = ndl * mix(0.75, 1.0, wrapN);
      vec3 Hh = normalize(L + V);
      float spec = pow(max(dot(Np, Hh), 0.0), shin) * specAmt;
      col += uLightCol[i].rgb * att * (base * diff + vec3(spec) * ndl * uLightCol[i].w);
    }
    col *= mix(0.55, 1.0, vAO);
    col += uEmissive + base * uEmTex;
  }
  if (uAdd > 0.5) {
    col *= (1.0 - fog) * a * vAO;
    oColor = vec4(col, 1.0);
  } else {
    col = mix(col, uFogColor, fog);
    oColor = vec4(col, a);
  }
}`;

const SH_PART_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec4 aCol;
layout(location=2) in vec2 aST;
uniform mat4 uProj, uView;
uniform float uViewH, uMaxPt, uFogDensity;
out vec4 vCol; flat out float vType; out float vFog;
void main(){
  vec4 vp = uView * vec4(aPos, 1.0);
  gl_Position = uProj * vp;
  float dist = max(-vp.z, 0.05);
  gl_PointSize = clamp(aST.x * uProj[1][1] * uViewH * 0.5 / dist, 1.0, uMaxPt);
  vCol = aCol; vType = aST.y;
  vFog = exp(-pow(dist * uFogDensity, 2.0));
}`;

const SH_PART_FS = `#version 300 es
precision highp float;
in vec4 vCol; flat in float vType; in float vFog;
uniform float uAdditive;
out vec4 o;
void main(){
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float a;
  if (vType < 0.5) {            // soft round glow
    float d = dot(p, p); if (d >= 1.0) discard; a = (1.0 - d); a *= a;
  } else if (vType < 1.5) {     // flame teardrop (top pointed)
    float y = p.y;              // -1 top, +1 bottom
    float w = mix(0.08, 0.62, smoothstep(-1.0, 0.45, y)) * (1.0 - smoothstep(0.5, 1.0, y) * 0.7);
    float d = abs(p.x) / max(w, 0.001);
    a = clamp(1.0 - d, 0.0, 1.0) * smoothstep(-1.0, -0.7, y) * (1.0 - smoothstep(0.75, 1.0, y));
    if (a <= 0.0) discard;
    a = pow(a, 0.6);
  } else if (vType < 2.5) {     // hard pixel
    a = 1.0;
  } else {                      // ring
    float d = length(p); a = smoothstep(0.75, 0.9, d) * (1.0 - smoothstep(0.9, 1.0, d)); if (a <= 0.0) discard;
  }
  if (uAdditive > 0.5) o = vec4(vCol.rgb * vCol.a * a * vFog, 1.0);
  else o = vec4(vCol.rgb, vCol.a * a * mix(0.2, 1.0, vFog));
}`;

const SH_POST_VS = `#version 300 es
out vec2 vUV;
void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vUV = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const SH_POST_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene;
uniform vec2 uRes;
uniform float uTime, uInsane, uDmg, uLowHP, uFade, uExposure, uGrain, uDither, uCA, uWarp, uGlitch, uVig, uSat;
uniform vec4 uFlash;
uniform vec3 uGrade;
out vec4 o;
const float BAYER[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main(){
  vec2 uv = vUV;
  float ins = uInsane;
  float w = uWarp * smoothstep(0.45, 1.0, ins);
  uv += w * 0.010 * vec2(sin(uv.y * 11.0 + uTime * 1.7), cos(uv.x * 9.0 + uTime * 1.3));
  uv = (uv - 0.5) * (1.0 - w * 0.025 * (0.5 + 0.5 * sin(uTime * 0.9))) + 0.5;
  if (uGlitch > 0.0) {
    float band = floor(uv.y * 48.0);
    float r = h12(vec2(band, floor(uTime * 24.0)));
    if (r > 0.82) uv.x += (r - 0.9) * 0.25 * uGlitch;
  }
  vec2 dir = uv - 0.5;
  float ca = uCA * (0.0015 + ins * 0.006 + uDmg * 0.012);
  vec3 c;
  c.r = texture(uScene, uv + dir * ca * 2.0).r;
  c.g = texture(uScene, uv).g;
  c.b = texture(uScene, uv - dir * ca * 2.0).b;
  c *= uExposure;
  c = aces(c);
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  float sat = uSat * (1.0 - ins * 0.55) * (1.0 - uLowHP * 0.6);
  c = mix(vec3(l), c, sat);
  c *= uGrade;
  c = pow(c, vec3(1.0 / 2.2));
  float vd = length(dir * vec2(1.0, 0.85));
  float vig = smoothstep(0.85, 0.2, vd * (1.0 + uVig * 0.6 + ins * 0.5 + uLowHP * 0.4));
  c *= mix(0.25, 1.0, vig);
  float edge = smoothstep(0.25, 0.75, vd);
  c = mix(c, vec3(0.35, 0.0, 0.0), clamp(uDmg * edge * 1.2 + uLowHP * edge * (0.35 + 0.25 * sin(uTime * 5.0)), 0.0, 0.8));
  c = mix(c, uFlash.rgb, uFlash.a);
  vec2 pix = floor(uv * uRes);
  float g = h12(pix + fract(uTime * 7.3) * 517.0) - 0.5;
  c += g * uGrain * (0.018 + 0.03 * (1.0 - l));
  if (uDither > 0.5) {
    ivec2 ip = ivec2(mod(pix, 4.0));
    float d = BAYER[ip.y * 4 + ip.x] / 16.0 - 0.5;
    float lv = 56.0;
    c = floor(c * lv + 0.5 + d) / lv;
  }
  c *= (1.0 - uFade);
  o = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.albTex); gl.uniform1i(u.uAlb, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.nrmTex); gl.uniform1i(u.uNrmTex, 1);
    this.stats.draws = 0;
  },
  viewmodelMode(on) {
    const gl = this.gl, u = this.u.world;
    if (on) { gl.clear(gl.DEPTH_BUFFER_BIT); gl.uniformMatrix4fv(u.uProj, false, this.vmProj); gl.uniform2f(u.uSnap, 0, 0); }
    else { gl.uniformMatrix4fv(u.uProj, false, this.proj); }
  },
  setFog(density) { this.gl.uniform1f(this.u.world.uFogDensity, density); },

  _w: [1, 1, 1, 1], _z: [0, 0, 0],
  draw(mesh, model, o) {
    const gl = this.gl, u = this.u.world;
    gl.uniformMatrix4fv(u.uModel, false, model);
    M4.normalMat(this.nm, model);
    gl.uniformMatrix3fv(u.uNrmMat, false, this.nm);
    const t = (o && o.tint) || this._w;
    gl.uniform4f(u.uTint, t[0], t[1], t[2], t.length > 3 ? t[3] : 1);
    const e = (o && o.em) || this._z;
    gl.uniform3f(u.uEmissive, e[0], e[1], e[2]);
    gl.uniform1f(u.uEmTex, (o && o.emTex) || 0);
    gl.uniform1f(u.uMatOverride, o && o.mat != null ? o.mat : -1);
    gl.uniform1f(u.uAlphaCut, (o && o.cut) || 0);
    gl.uniform1f(u.uAdd, o && o.add ? 1 : 0);
    gl.uniform1f(u.uUnlit, o && o.unlit ? 1 : 0);
    gl.uniform1f(u.uRim, (o && o.rim) || 0);
    gl.bindVertexArray(mesh.vao);
    gl.drawElements(gl.TRIANGLES, mesh.count, mesh.type, 0);
    this.stats.draws++;
  },
  blendMode(mode) {
    const gl = this.gl;
    if (mode === 'add') { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false); }
    else if (mode === 'alpha') { gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); }
    else { gl.disable(gl.BLEND); gl.depthMask(true); }
  },
  cull(on) { const gl = this.gl; if (on) gl.enable(gl.CULL_FACE); else gl.disable(gl.CULL_FACE); },

  // ---- particles ----
  pClear() { this.partAdd.n = 0; this.partAlpha.n = 0; },
  p(x, y, z, r, g, b, a, size, type, additive) {
    const P = additive ? this.partAdd : this.partAlpha;
    if (P.n >= this.partCap) return;
    const d = P.data, o = P.n * 9;
    d[o] = x; d[o + 1] = y; d[o + 2] = z; d[o + 3] = r; d[o + 4] = g; d[o + 5] = b; d[o + 6] = a; d[o + 7] = size; d[o + 8] = type;
    P.n++;
  },
  drawParticles(proj) {
    const gl = this.gl, u = this.u.part;
    gl.useProgram(this.prog.part);
    gl.uniformMatrix4fv(u.uProj, false, proj || this.proj);
    gl.uniformMatrix4fv(u.uView, false, this.view);
    gl.uniform1f(u.uViewH, this.lowH);
    gl.uniform1f(u.uMaxPt, this.maxPt);
    gl.uniform1f(u.uFogDensity, this.fogDensity);
    gl.bindVertexArray(this.partVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.partBuf);
    gl.enable(gl.BLEND); gl.depthMask(false);
    if (this.partAlpha.n) {
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.uniform1f(u.uAdditive, 0);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.partAlpha.data, 0, this.partAlpha.n * 9);
      gl.drawArrays(gl.POINTS, 0, this.partAlpha.n);
    }
    if (this.partAdd.n) {
      gl.blendFunc(gl.ONE, gl.ONE); gl.uniform1f(u.uAdditive, 1);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.partAdd.data, 0, this.partAdd.n * 9);
      gl.drawArrays(gl.POINTS, 0, this.partAdd.n);
    }
    gl.depthMask(true); gl.disable(gl.BLEND);
    gl.bindVertexArray(null);
    gl.useProgram(this.prog.world);
  },

  post(p) {
    const gl = this.gl, u = this.u.post;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.W, this.H);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
    gl.useProgram(this.prog.post);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.colorTex); gl.uniform1i(u.uScene, 0);
    gl.uniform2f(u.uRes, this.lowW, this.lowH);
    gl.uniform1f(u.uTime, p.time); gl.uniform1f(u.uInsane, p.insane); gl.uniform1f(u.uDmg, p.dmg);
    gl.uniform1f(u.uLowHP, p.lowhp); gl.uniform1f(u.uFade, p.fade); gl.uniform1f(u.uExposure, p.exposure);
    gl.uniform1f(u.uGrain, p.grain); gl.uniform1f(u.uDither, p.dither); gl.uniform1f(u.uCA, p.ca);
    gl.uniform1f(u.uWarp, p.warp); gl.uniform1f(u.uGlitch, p.glitch); gl.uniform1f(u.uVig, p.vig); gl.uniform1f(u.uSat, p.sat);
    gl.uniform4fv(u.uFlash, p.flash); gl.uniform3fv(u.uGrade, p.grade);
    gl.bindVertexArray(this.emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
  },
};

// ==== 03_meshes.js ====
// ---------------------------------------------------------------------------
// Mesh builder, primitives, and procedural models (props, items, weapons)
// ---------------------------------------------------------------------------
class MB {
  constructor() { this.v = []; this.i = []; this.n = 0; this.m = M4.create(); this.nm = new Float32Array(9); this.stack = []; M4.normalMat(this.nm, this.m); }
  reset() { M4.identity(this.m); M4.normalMat(this.nm, this.m); return this; }
  push() { this.stack.push(new Float32Array(this.m)); return this; }
  pop() { this.m = this.stack.pop(); M4.normalMat(this.nm, this.m); return this; }
  T(x, y, z) { M4.translate(this.m, this.m, x, y, z); return this; }
  RX(a) { M4.rotateX(this.m, this.m, a); M4.normalMat(this.nm, this.m); return this; }
  RY(a) { M4.rotateY(this.m, this.m, a); M4.normalMat(this.nm, this.m); return this; }
  RZ(a) { M4.rotateZ(this.m, this.m, a); M4.normalMat(this.nm, this.m); return this; }
  S(x, y, z) { M4.scale(this.m, this.m, x, y == null ? x : y, z == null ? x : z); M4.normalMat(this.nm, this.m); return this; }
  vert(x, y, z, nx, ny, nz, u, v, mat, ao) {
    const m = this.m, q = this.nm;
    const px = m[0] * x + m[4] * y + m[8] * z + m[12], py = m[1] * x + m[5] * y + m[9] * z + m[13], pz = m[2] * x + m[6] * y + m[10] * z + m[14];
    let tx = q[0] * nx + q[3] * ny + q[6] * nz, ty = q[1] * nx + q[4] * ny + q[7] * nz, tz = q[2] * nx + q[5] * ny + q[8] * nz;
    const l = Math.hypot(tx, ty, tz) || 1; tx /= l; ty /= l; tz /= l;
    this.v.push(px, py, pz, tx, ty, tz, u, v, mat, ao == null ? 1 : ao);
    return this.n++;
  }
  quad(a, b, c, d, nx, ny, nz, uv, mat, ao) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const cx = uy * vz - uz * vy, cy = uz * vx - ux * vz, cz = ux * vy - uy * vx;
    const flip = cx * nx + cy * ny + cz * nz < 0;
    const A = ao || [1, 1, 1, 1];
    const i0 = this.vert(a[0], a[1], a[2], nx, ny, nz, uv[0], uv[1], mat, A[0]);
    const i1 = this.vert(b[0], b[1], b[2], nx, ny, nz, uv[2], uv[3], mat, A[1]);
    const i2 = this.vert(c[0], c[1], c[2], nx, ny, nz, uv[4], uv[5], mat, A[2]);
    const i3 = this.vert(d[0], d[1], d[2], nx, ny, nz, uv[6], uv[7], mat, A[3]);
    if (!flip) this.i.push(i0, i1, i2, i0, i2, i3); else this.i.push(i0, i2, i1, i0, i3, i2);
  }
  // axis-aligned box centered at origin (in current transform), ts = meters per texture tile
  box(w, h, d, mat, ts = 1, ao) {
    const x = w / 2, y = h / 2, z = d / 2, s = 1 / ts;
    const A = ao || null;
    // +X
    this.quad([x, -y, z], [x, -y, -z], [x, y, -z], [x, y, z], 1, 0, 0, [0, h * s, d * s, h * s, d * s, 0, 0, 0], mat, A && [A[0], A[0], A[1], A[1]]);
    // -X
    this.quad([-x, -y, -z], [-x, -y, z], [-x, y, z], [-x, y, -z], -1, 0, 0, [0, h * s, d * s, h * s, d * s, 0, 0, 0], mat, A && [A[0], A[0], A[1], A[1]]);
    // +Y
    this.quad([-x, y, z], [x, y, z], [x, y, -z], [-x, y, -z], 0, 1, 0, [0, d * s, w * s, d * s, w * s, 0, 0, 0], mat, A && [A[1], A[1], A[1], A[1]]);
    // -Y
    this.quad([-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], 0, -1, 0, [0, 0, w * s, 0, w * s, d * s, 0, d * s], mat, A && [A[0], A[0], A[0], A[0]]);
    // +Z
    this.quad([-x, -y, z], [x, -y, z], [x, y, z], [-x, y, z], 0, 0, 1, [0, h * s, w * s, h * s, w * s, 0, 0, 0], mat, A && [A[0], A[0], A[1], A[1]]);
    // -Z
    this.quad([x, -y, -z], [-x, -y, -z], [-x, y, -z], [x, y, -z], 0, 0, -1, [0, h * s, w * s, h * s, w * s, 0, 0, 0], mat, A && [A[0], A[0], A[1], A[1]]);
    return this;
  }
  // cylinder along Y centered at origin. rTop optional (cone/taper)
  cyl(r, h, seg, mat, ts = 1, rTop = r, caps = true, aoBot = 1, aoTop = 1) {
    const y0 = -h / 2, y1 = h / 2, s = 1 / ts, slope = (r - rTop) / h;
    const circ = TAU * Math.max(r, rTop);
    const base = this.n;
    for (let k = 0; k <= seg; k++) {
      const a = (k / seg) * TAU, c = Math.cos(a), sn = Math.sin(a);
      const nl = Math.hypot(1, slope);
      const nx = c / nl, ny = slope / nl, nz = sn / nl;
      const u = (k / seg) * circ * s;
      this.vert(c * r, y0, sn * r, nx, ny, nz, u, h * s, mat, aoBot);
      this.vert(c * rTop, y1, sn * rTop, nx, ny, nz, u, 0, mat, aoTop);
    }
    for (let k = 0; k < seg; k++) {
      const a = base + k * 2, b = a + 1, c = a + 2, d = a + 3;
      this.i.push(a, b, d, a, d, c);
    }
    if (caps) {
      if (rTop > 0.0001) { const ct = this.vert(0, y1, 0, 0, 1, 0, 0.5, 0.5, mat, aoTop); const st = this.n; for (let k = 0; k <= seg; k++) { const a = (k / seg) * TAU; this.vert(Math.cos(a) * rTop, y1, Math.sin(a) * rTop, 0, 1, 0, 0.5 + Math.cos(a) * rTop * s, 0.5 + Math.sin(a) * rTop * s, mat, aoTop); } for (let k = 0; k < seg; k++) this.i.push(ct, st + k + 1, st + k); }
      if (r > 0.0001) { const cb = this.vert(0, y0, 0, 0, -1, 0, 0.5, 0.5, mat, aoBot); const sb = this.n; for (let k = 0; k <= seg; k++) { const a = (k / seg) * TAU; this.vert(Math.cos(a) * r, y0, Math.sin(a) * r, 0, -1, 0, 0.5 + Math.cos(a) * r * s, 0.5 + Math.sin(a) * r * s, mat, aoBot); } for (let k = 0; k < seg; k++) this.i.push(cb, sb + k, sb + k + 1); }
    }
    return this;
  }
  // ellipsoid
  sphere(rx, ry, rz, su, sv, mat, ts = 1) {
    const base = this.n;
    for (let j = 0; j <= sv; j++) {
      const th = (j / sv) * PI, st = Math.sin(th), ct = Math.cos(th);
      for (let k = 0; k <= su; k++) {
        const ph = (k / su) * TAU, sp = Math.sin(ph), cp = Math.cos(ph);
        const x = cp * st, y = ct, z = sp * st;
        let nx = x / rx, ny = y / ry, nz = z / rz; const l = Math.hypot(nx, ny, nz) || 1;
        this.vert(x * rx, y * ry, z * rz, nx / l, ny / l, nz / l, (k / su) * 2 * Math.max(rx, rz) * TAU / ts / 2, (j / sv) * PI * ry / ts, mat, 1);
      }
    }
    for (let j = 0; j < sv; j++) for (let k = 0; k < su; k++) {
      const a = base + j * (su + 1) + k, b = a + su + 1;
      this.i.push(a, a + 1, b, a + 1, b + 1, b);
    }
    return this;
  }
  // flat double-sided quad in XY plane centered, facing +Z (and -Z)
  card(w, h, mat, twoSided = true, uvs) {
    const x = w / 2, y = h / 2, U = uvs || [0, 1, 1, 1, 1, 0, 0, 0];
    this.quad([-x, -y, 0], [x, -y, 0], [x, y, 0], [-x, y, 0], 0, 0, 1, U, mat);
    if (twoSided) this.quad([x, -y, 0], [-x, -y, 0], [-x, y, 0], [x, y, 0], 0, 0, -1, [U[2], U[3], U[0], U[1], U[6], U[7], U[4], U[5]], mat);
    return this;
  }
  build() {
    const v = new Float32Array(this.v);
    const idx = this.n > 65535 ? new Uint32Array(this.i) : new Uint16Array(this.i);
    return R.createMesh(v, idx);
  }
}

// --- unit meshes for animated parts
const UNIT = {};
function buildUnitMeshes() {
  UNIT.box = new MB().box(1, 1, 1, MAT.WHITE, 0.5).build();
  UNIT.sphere = new MB().sphere(0.5, 0.5, 0.5, 12, 9, MAT.WHITE, 0.5).build();
  UNIT.lsphere = new MB().sphere(0.5, 0.5, 0.5, 7, 5, MAT.WHITE, 0.5).build();
  UNIT.cyl = new MB().cyl(0.5, 1, 8, MAT.WHITE, 0.5).build();
  UNIT.taper = new MB().cyl(0.5, 1, 8, MAT.WHITE, 0.5, 0.32).build();
  UNIT.limb = new MB().cyl(0.36, 1, 7, MAT.WHITE, 0.5, 0.5).build();
  UNIT.cone = new MB().cyl(0.5, 1, 10, MAT.WHITE, 0.5, 0.0).build();
  UNIT.card = new MB().card(1, 1, MAT.WHITE).build();
  UNIT.disc = new MB().cyl(0.5, 0.02, 24, MAT.WHITE, 1, 0.5).build();
  // light shaft: open cone with ao gradient (bright top, transparent bottom)
  const sh = new MB(); const seg = 16;
  const rings = [[0, 1.0, 0], [0.5, 0.75, 0.1], [0.85, 0.55, 0.45], [1, 0.45, 1]];
  for (const [y, r, ao] of rings) for (let k = 0; k <= seg; k++) { const a = k / seg * TAU; sh.vert(Math.cos(a) * r, y, Math.sin(a) * r, Math.cos(a), 0, Math.sin(a), 0, 0, MAT.WHITE, ao); }
  for (let j = 0; j < rings.length - 1; j++) for (let k = 0; k < seg; k++) { const a = j * (seg + 1) + k, b = a + seg + 1; sh.i.push(a, b, b + 1, a, b + 1, a + 1); }
  UNIT.shaft = sh.build();
}

// ---------------------------------------------------------------------------
// Props (written into a builder at the current transform). Return metadata.
// ---------------------------------------------------------------------------
const PROPS = {
  candles(mb, rng, count, spread = 0.25) {
    const flames = [];
    for (let k = 0; k < count; k++) {
      const a = rng.range(0, TAU), d = rng.range(0, spread), h = rng.range(0.08, 0.38), r = rng.range(0.025, 0.045);
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      mb.push().T(x, h / 2, z).cyl(r, h, 7, MAT.WAX, 0.3).pop();
      mb.push().T(x, 0.005, z).cyl(r * 2.2, 0.01, 8, MAT.WAX, 0.3, r * 1.6).pop();
      flames.push([x, h + 0.035, z]);
    }
    return flames;
  },
  coffin(mb, rng, ajar) {
    mb.push().T(0, 0.22, 0).box(0.75, 0.44, 1.95, MAT.WOOD, 1.0, [0.6, 1]).pop();
    if (ajar) {
      mb.push().T(0.25, 0.47, 0.1).RY(0.35).RZ(0.08).box(0.8, 0.06, 2.0, MAT.WOOD, 1.0).pop();
      // skeletal arm hanging out
      mb.push().T(-0.33, 0.36, -0.3).RZ(1.2).box(0.04, 0.32, 0.04, MAT.BONE, 0.3).pop();
      mb.push().T(-0.47, 0.18, -0.3).RZ(0.2).box(0.035, 0.28, 0.035, MAT.BONE, 0.3).pop();
    } else {
      mb.push().T(0, 0.47, 0).box(0.82, 0.06, 2.02, MAT.WOOD, 1.0).pop();
      mb.push().T(0, 0.51, 0.3).box(0.06, 0.02, 0.5, MAT.IRON, 0.5).pop();
      mb.push().T(0, 0.51, 0.45).box(0.3, 0.02, 0.06, MAT.IRON, 0.5).pop();
    }
  },
  sarcophagus(mb, rng, mat) {
    mb.push().T(0, 0.4, 0).box(1.0, 0.8, 2.2, mat, 1.0, [0.55, 1]).pop();
    mb.push().T(0, 0.86, 0).box(1.1, 0.12, 2.3, mat, 1.0).pop();
    mb.push().T(0, 0.98, 0.55).sphere(0.17, 0.12, 0.2, 8, 6, MAT.STATUE, 0.5).pop();
    mb.push().T(0, 0.97, -0.15).box(0.45, 0.12, 1.1, MAT.STATUE, 0.6).pop();
  },
  crate(mb, rng, s = 0.8) {
    mb.push().T(0, s / 2, 0).box(s, s, s, MAT.WOOD, 1.2, [0.55, 1]).pop();
    mb.push().T(0, s / 2, s / 2 + 0.01).box(s * 0.9, 0.06, 0.02, MAT.WOOD, 1.2).pop();
  },
  barrel(mb, rng) {
    mb.push().T(0, 0.5, 0).cyl(0.36, 1.0, 12, MAT.WOOD, 1.0, 0.36, true, 0.6, 1).pop();
    mb.push().T(0, 0.18, 0).cyl(0.375, 0.06, 12, MAT.IRON, 0.5, 0.375, false).pop();
    mb.push().T(0, 0.82, 0).cyl(0.375, 0.06, 12, MAT.IRON, 0.5, 0.375, false).pop();
  },
  bones(mb, rng, n = 14, spread = 0.6) {
    for (let k = 0; k < n; k++) {
      const x = rng.range(-spread, spread), z = rng.range(-spread, spread) * 0.6;
      mb.push().T(x, 0.03 + rng.range(0, 0.12), z).RY(rng.range(0, TAU)).RZ(rng.range(-0.5, 0.5)).RX(PI / 2);
      mb.box(0.045, rng.range(0.25, 0.45), 0.045, MAT.BONE, 0.3).pop();
    }
    const sk = rng.int(1, 3);
    for (let k = 0; k < sk; k++) PROPS.skull(mb, rng, rng.range(-spread, spread), 0.1, rng.range(-spread, spread) * 0.5, rng.range(0, TAU), rng.range(-0.5, 0.5));
  },
  skull(mb, rng, x, y, z, yaw, tilt) {
    mb.push().T(x, y, z).RY(yaw).RX(tilt || 0);
    mb.push().sphere(0.1, 0.105, 0.12, 8, 6, MAT.BONE, 0.3).pop();
    mb.push().T(0, -0.06, 0.06).box(0.11, 0.05, 0.08, MAT.BONE, 0.3).pop();
    mb.push().T(-0.038, 0.0, 0.098).sphere(0.028, 0.03, 0.02, 6, 4, MAT.VOID, 0.3).pop();
    mb.push().T(0.038, 0.0, 0.098).sphere(0.028, 0.03, 0.02, 6, 4, MAT.VOID, 0.3).pop();
    mb.push().T(0, -0.035, 0.112).box(0.02, 0.025, 0.01, MAT.VOID, 0.3).pop();
    mb.pop();
  },
  skullLite(mb, x, y, z, yaw, tilt) {
    mb.push().T(x, y, z).RY(yaw).RX(tilt || 0);
    mb.push().sphere(0.1, 0.105, 0.115, 6, 5, MAT.BONE, 0.3).pop();
    mb.push().T(0, -0.065, 0.05).box(0.1, 0.045, 0.07, MAT.BONE, 0.3).pop();
    mb.push().T(-0.038, 0.0, 0.112).card(0.045, 0.045, MAT.VOID, false).pop();
    mb.push().T(0.038, 0.0, 0.112).card(0.045, 0.045, MAT.VOID, false).pop();
    mb.pop();
  },
  // rows of skulls set into a wall (local: wall plane at z=0 facing +z, width w)
  skullWall(mb, rng, w, h0, h1) {
    for (let y = h0; y < h1; y += 0.24) {
      for (let x = -w / 2 + 0.14; x < w / 2 - 0.1; x += 0.24) {
        if (rng.chance(0.12)) continue;
        PROPS.skullLite(mb, x + rng.range(-0.02, 0.02), y + rng.range(-0.02, 0.02), 0.02, rng.range(-0.25, 0.25), rng.range(-0.2, 0.2));
      }
      // long bones layer
      mb.push().T(0, y + 0.13, 0.03).RZ(PI / 2).cyl(0.035, w - 0.15, 6, MAT.BONE, 0.3).pop();
    }
  },
  // burial niches (loculi) set into a wall plane at z=0 facing +z; width w
  niches(mb, rng, w, mat, rows, h0) {
    const cols = Math.max(1, Math.floor(w / 1.3));
    const cw = w / cols, nh = 0.62, nw = Math.min(1.0, cw - 0.25), dep = 0.12;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (rng.chance(0.12)) continue;
      const x = -w / 2 + cw * (c + 0.5), y = h0 + r * (nh + 0.32) + nh / 2;
      mb.push().T(x, y, 0.0);
      mb.push().T(0, nh / 2 + 0.05, dep / 2).box(nw + 0.18, 0.1, dep, mat, 1).pop();
      mb.push().T(0, -nh / 2 - 0.05, dep / 2).box(nw + 0.18, 0.1, dep + 0.04, mat, 1).pop();
      mb.push().T(-nw / 2 - 0.045, 0, dep / 2).box(0.09, nh, dep, mat, 1).pop();
      mb.push().T(nw / 2 + 0.045, 0, dep / 2).box(0.09, nh, dep, mat, 1).pop();
      mb.push().T(0, 0, 0.012).card(nw, nh, MAT.VOID, false).pop();
      const k = rng.next();
      if (k < 0.55) { PROPS.skullLite(mb, rng.range(-nw * 0.25, nw * 0.25), -nh / 2 + 0.1, 0.12, rng.range(-0.6, 0.6), rng.range(-0.2, 0.3)); for (let b = 0; b < 3; b++) mb.push().T(rng.range(-nw * 0.35, nw * 0.35), -nh / 2 + 0.025, 0.08).RY(rng.range(-0.4, 0.4)).RZ(PI / 2).box(0.04, rng.range(0.25, 0.4), 0.04, MAT.BONE, 0.3).pop(); }
      else if (k < 0.8) { mb.push().T(0, -nh / 2 + 0.11, 0.1).S(nw * 0.9, 0.2, 0.16).sphere(0.5, 0.5, 0.5, 8, 5, MAT.CLOTH, 0.5).pop(); }
      mb.pop();
    }
  },
  rubble(mb, rng, mat, n = 6, spread = 0.6) {
    for (let k = 0; k < n; k++) { const s = rng.range(0.06, 0.22); mb.push().T(rng.range(-spread, spread), s * 0.4, rng.range(-spread, spread)).RY(rng.range(0, TAU)).RX(rng.range(-0.4, 0.4)).box(s * rng.range(0.8, 1.6), s * 0.8, s, mat, 0.5).pop(); }
  },
  urn(mb, rng, broken) {
    const m = MAT.STATUE;
    if (!broken) { mb.push().T(0, 0.26, 0).S(1, 1, 1).sphere(0.2, 0.26, 0.2, 9, 7, m, 0.5).pop(); mb.push().T(0, 0.54, 0).cyl(0.09, 0.1, 9, m, 0.4, 0.12).pop(); }
    else { for (let k = 0; k < 5; k++) mb.push().T(rng.range(-0.3, 0.3), 0.04, rng.range(-0.3, 0.3)).RY(rng.range(0, TAU)).RZ(rng.range(-0.6, 0.6)).box(rng.range(0.1, 0.2), 0.04, rng.range(0.08, 0.16), m, 0.4).pop(); mb.push().T(0, 0.12, 0).cyl(0.17, 0.24, 9, m, 0.4, 0.2, false).pop(); }
  },
  pillar(mb, h, mat, s = 0.7) {
    mb.push().T(0, 0.15, 0).box(s + 0.2, 0.3, s + 0.2, mat, 1.0, [0.5, 1]).pop();
    mb.push().T(0, h / 2, 0).box(s, h, s, mat, 1.5, [0.6, 1]).pop();
    mb.push().T(0, h - 0.2, 0).box(s + 0.25, 0.4, s + 0.25, mat, 1.0).pop();
  },
  brazier(mb) {
    for (let k = 0; k < 3; k++) { const a = k / 3 * TAU; mb.push().T(Math.cos(a) * 0.22, 0.4, Math.sin(a) * 0.22).RY(-a).RZ(0.18).box(0.05, 0.85, 0.05, MAT.IRON, 0.5).pop(); }
    mb.push().T(0, 0.85, 0).cyl(0.36, 0.22, 10, MAT.IRON, 0.6, 0.42, true).pop();
    mb.push().T(0, 0.97, 0).cyl(0.34, 0.04, 10, MAT.VOID, 0.6, 0.34, true).pop();
    return [0, 1.12, 0];
  },
  chain(mb, len, mat = MAT.IRON) {
    const links = Math.floor(len / 0.09);
    for (let k = 0; k < links; k++) mb.push().T(0, -k * 0.09, 0).RY(k % 2 ? PI / 2 : 0).box(0.05, 0.1, 0.012, mat, 0.3).pop();
  },
  cage(mb, rng) {
    const r = 0.45, h = 1.3, bars = 10;
    for (let k = 0; k < bars; k++) { const a = k / bars * TAU; mb.push().T(Math.cos(a) * r, 0, Math.sin(a) * r).box(0.025, h, 0.025, MAT.IRON, 0.5).pop(); }
    mb.push().T(0, -h / 2, 0).cyl(r + 0.02, 0.04, 12, MAT.IRON, 0.6).pop();
    mb.push().T(0, h / 2, 0).cyl(r + 0.02, 0.04, 12, MAT.IRON, 0.6, 0.1).pop();
    // occupant: slumped skeleton
    PROPS.skull(mb, rng, 0.05, -h / 2 + 0.55, 0.05, rng.range(0, TAU), 0.6);
    mb.push().T(0, -h / 2 + 0.3, 0).RX(0.3).box(0.22, 0.4, 0.12, MAT.BONE, 0.3).pop();
    mb.push().T(0.15, -h / 2 + 0.1, 0.1).RZ(1.2).box(0.04, 0.4, 0.04, MAT.BONE, 0.3).pop();
  },
  pew(mb, len) {
    mb.push().T(0, 0.45, 0).box(len, 0.06, 0.45, MAT.WOOD, 1.0).pop();
    mb.push().T(0, 0.75, -0.2).box(len, 0.55, 0.05, MAT.WOOD, 1.0).pop();
    mb.push().T(-len / 2 + 0.05, 0.25, 0).box(0.06, 0.5, 0.4, MAT.WOOD, 1.0).pop();
    mb.push().T(len / 2 - 0.05, 0.25, 0).box(0.06, 0.5, 0.4, MAT.WOOD, 1.0).pop();
  },
  altar(mb, rng) {
    mb.push().T(0, 0.5, 0).box(1.6, 1.0, 0.8, MAT.STATUE, 1.0, [0.55, 1]).pop();
    mb.push().T(0, 1.03, 0).box(1.75, 0.08, 0.92, MAT.STATUE, 1.0).pop();
    mb.push().T(0, 1.075, 0).box(0.5, 0.01, 0.94, MAT.CLOTH, 0.6).pop();
    mb.push().T(0, 0.6, 0.47).box(0.5, 0.9, 0.01, MAT.CLOTH, 0.6).pop();
    mb.push().T(0, 1.0 + 0.08, 0);
    const fl = [];
    for (const f of PROPS.candles(mb, rng, 5, 0.55)) fl.push([f[0], f[1] + 1.08, f[2]]);
    mb.pop();
    // candle-crowned figure statue behind altar
    return fl;
  },
  table(mb, rng) {
    mb.push().T(0, 0.78, 0).box(1.4, 0.07, 0.8, MAT.WOOD, 1.0).pop();
    for (const [x, z] of [[-0.62, -0.32], [0.62, -0.32], [-0.62, 0.32], [0.62, 0.32]]) mb.push().T(x, 0.38, z).box(0.07, 0.76, 0.07, MAT.WOOD, 0.8).pop();
  },
  cocoon(mb, rng, len) {
    PROPS.chain(mb, 0.6, MAT.ROPE);
    mb.push().T(0, -0.6 - len / 2, 0).RZ(rng.range(-0.08, 0.08)).sphere(0.22, len / 2, 0.2, 9, 8, MAT.GROWTH, 0.6).pop();
  },
  growth(mb, rng, w, h) {
    // fleshy tendrils on a wall plane (z=0 facing +z)
    for (let k = 0; k < 6; k++) {
      const x = rng.range(-w / 2, w / 2), y = rng.range(0.2, h);
      mb.push().T(x, y, 0.02).RZ(rng.range(-0.6, 0.6)).sphere(rng.range(0.05, 0.12), rng.range(0.4, 1.1), 0.06, 6, 6, MAT.GROWTH, 0.6).pop();
    }
    for (let k = 0; k < 4; k++) mb.push().T(rng.range(-w / 2, w / 2), rng.range(0.2, h), 0.04).sphere(rng.range(0.1, 0.2), rng.range(0.1, 0.2), 0.08, 7, 6, MAT.GROWTH, 0.6).pop();
  },
  statue(mb, rng, pose) {
    // a veiled weeping figure on a plinth (also used as decoy for Weepers)
    mb.push().T(0, 0.15, 0).box(0.9, 0.3, 0.9, MAT.STATUE, 1.0, [0.6, 1]).pop();
    mb.push().T(0, 0.3, 0);
    buildFigureMB(mb, pose == null ? 0 : pose);
    mb.pop();
  },
  well(mb, mat) {
    // ring of stone around a pit (pit is a dark disc)
    const seg = 14, r0 = 1.05, r1 = 1.4, h = 0.75;
    for (let k = 0; k < seg; k++) {
      const a = (k + 0.5) / seg * TAU;
      mb.push().T(Math.cos(a) * (r0 + r1) / 2, h / 2, Math.sin(a) * (r0 + r1) / 2).RY(-a).box(r1 - r0, h, (r1 + r0) / 2 * TAU / seg + 0.02, mat, 1.0, [0.6, 1]).pop();
    }
    mb.push().T(0, 0.01, 0).cyl(r0 + 0.05, 0.02, 20, MAT.VOID, 1, r0 + 0.05).pop();
    // windlass posts
    mb.push().T(-1.3, 1.1, 0).box(0.14, 2.2, 0.14, MAT.WOOD, 1).pop();
    mb.push().T(1.3, 1.1, 0).box(0.14, 2.2, 0.14, MAT.WOOD, 1).pop();
    mb.push().T(0, 2.1, 0).RZ(PI / 2).cyl(0.08, 2.7, 8, MAT.WOOD, 1).pop();
    mb.push().T(0, 1.4, 0).cyl(0.02, 1.4, 5, MAT.ROPE, 0.5).pop();
  },
};

// Static weeping figure (used by statues and Weepers' rest pose) into builder
function buildFigureMB(mb, pose) {
  const m = MAT.STATUE;
  const tap = (x, y, z, sx, sy, sz) => mb.push().T(x, y, z).S(sx, sy, sz).cyl(0.5, 1, 10, m, 0.5, 0.32).pop();
  const sph = (x, y, z, sx, sy, sz) => mb.push().T(x, y, z).S(sx, sy, sz).sphere(0.5, 0.5, 0.5, 10, 8, m, 0.5).pop();
  const limbMB = (px, py, pz, rx, rz, len, th, child) => {
    mb.push().T(px, py, pz).RZ(rz).RX(rx);
    mb.push().T(0, -len / 2, 0).S(th, len, th).cyl(0.36, 1, 7, m, 0.5, 0.5).pop();
    if (child) { mb.push().T(0, -len, 0); child(); mb.pop(); }
    mb.pop();
  };
  tap(0, 0.62, 0, 0.78, 1.25, 0.66);
  for (let k = 0; k < 5; k++) mb.push().T(Math.cos(k * 1.3) * 0.3, 0.3, Math.sin(k * 1.3) * 0.26).RY(k * 1.3).RZ(0.05).box(0.08, 0.6, 0.04, m, 0.5).pop();
  sph(0, 1.36, 0, 0.42, 0.56, 0.28);
  tap(0, 1.52, 0, 0.62, 0.42, 0.46);
  mb.push().T(0, 1.79, 0.03).RY(pose === 2 ? 0.35 : 0).RX(pose === 1 ? -0.2 : 0.42).RZ(pose === 2 ? 0.5 : 0);
  sph(0, 0.02, 0, 0.25, 0.3, 0.27); sph(0, 0.05, -0.03, 0.3, 0.33, 0.3); tap(0, -0.08, -0.04, 0.36, 0.3, 0.32);
  if (pose === 0) mb.push().T(0, 0, 0.14).box(0.19, 0.15, 0.06, m, 0.5).pop();
  mb.pop();
  if (pose === 0) {
    for (const s of [-1, 1]) limbMB(s * 0.2, 1.55, 0, -1.45, s * 0.3, 0.3, 0.075, () => limbMB(0, 0, 0, -1.55, -s * 0.85, 0.3, 0.065));
  } else if (pose === 1) {
    for (const s of [-1, 1]) limbMB(s * 0.21, 1.55, 0, -1.4, s * 0.1, 0.32, 0.075, () => limbMB(0, 0, 0, -0.15, 0, 0.32, 0.065));
  } else {
    limbMB(0.21, 1.55, 0, -1.5, -0.1, 0.32, 0.075, () => limbMB(0, 0, 0, 0, 0, 0.32, 0.065, () => mb.push().T(0, -0.1, 0).box(0.014, 0.2, 0.014, m, 0.3).pop()));
    limbMB(-0.21, 1.55, 0, 0.1, 0.12, 0.66, 0.07);
  }
}

const AU = {
  ctx: null, ok: false, voices: 0, maxVoices: 40,
  vol: { master: 0.85, sfx: 0.9, amb: 0.8, mus: 0.7 },
  lx: 0, ly: 0, lz: 0,
  amb_nodes: null, fear: null, musicTimer: null, musicMode: null, lastStinger: -99,
  occlusionFn: null,

  init(ctx) {
    if (this.ok) return true;

      this.ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { console.warn('Audio unavailable', e); return false; }

    this.mus = c.createGain(); this.mus.connect(this.master);

function makeWeapon(base, rarity, floor, rng) {
  const B = WEAPONS[base];
  const w = { base, rarity, floor, dmg: B.dmg, rate: B.rate, reach: B.reach, sta: B.sta, crit: B.crit, critMul: B.critMul || 2.0, bleed: B.bleed || 0, burn: B.burn || 0, spirit: B.spirit || 0, stagger: B.stagger || 1, knock: B.knock || 1, light: !!B.light, affixes: [] };
  const pre = rarity >= 1 ? rng.pick(AFFIX_PRE) : null;
  const suf = rarity >= 2 ? rng.pick(AFFIX_SUF) : null;
  if (pre) { pre.apply(w); w.affixes.push(pre.id); }
  if (suf) { suf.apply(w); w.affixes.push(suf.id); }
  w.dmg *= RARITY[rarity].mul * (1 + 0.1 * (floor - 1));
  w.name = (pre ? pre.name + ' ' : '') + B.name + (suf ? ' ' + suf.name : '');
  return w;
}
function weaponAffixText(w) {

  for (const id of w.affixes) { const a = AFFIX_PRE.find((x) => x.id === id) || AFFIX_SUF.find((x) => x.id === id); if (a) out.push(a.desc); }

}
