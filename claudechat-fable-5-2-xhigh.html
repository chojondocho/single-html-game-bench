<!DOCTYPE html>
<!--
  SUNKEN VIGIL  ·  v1.0
  A first-person roguelike horror RPG in a single self-contained file.
  No external assets, libraries or network requests: the renderer (WebGL 2), every texture,
  every model, every sound and all music are generated at runtime by the code below.
  Progress is stored in the browser (localStorage) under keys prefixed "sunkenvigil.".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunken Vigil</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M16 4c5 6 8 9 8 14a8 8 0 0 1-16 0c0-5 3-8 8-14z' fill='%23e9c98a'/%3E%3Cpath d='M16 13c2 3 4 4 4 7a4 4 0 0 1-8 0c0-3 2-4 4-7z' fill='%23050505'/%3E%3C/svg%3E">
<meta name="description" content="Sunken Vigil — a first-person roguelike horror RPG. Carry the last lamp down seven floors of a drowned sanatorium.">
<style>
:root{--lamp:#e9c98a;--lamp2:#a98652;--blood:#b0352b;--bone:#d3ccb8;--dim:#8d8878;--faint:#5b584f;--panel:rgba(8,9,10,.9);--line:rgba(211,204,184,.16);--san:#93a6cf;--stam:#c2aa66;--oil:#e2b35c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--bone);font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
.sc{font-variant:small-caps;letter-spacing:.14em}
.num{font-family:'Courier New',ui-monospace,monospace;font-weight:700}
/* ------------------------------------------------------------- HUD */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 3px #000,0 0 8px #000;transition:opacity .5s}
#xp{position:absolute;left:0;top:0;height:2px;background:var(--lamp2);width:0;transition:width .4s}
#tl{position:absolute;left:22px;top:16px;font-size:13px;line-height:1.5}
#floorname{font-size:12px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
#objective{color:var(--lamp);font-style:italic;font-size:14px;margin-top:2px}
#purse{margin-top:6px;color:var(--bone);font-size:13px;display:flex;gap:14px;align-items:center}
#purse svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;fill:var(--bone)}
#vit{position:absolute;left:22px;bottom:20px;width:250px}
.bar{position:relative;height:9px;background:rgba(0,0,0,.6);border:1px solid var(--line);margin-top:7px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transition:transform .12s linear}
.bar b{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;background:#fff;opacity:.35;transition:transform .6s ease-out .15s}
.bar span{position:absolute;right:-44px;top:-4px;font-size:12px;width:38px;text-align:left;color:var(--dim)}
.bar em{position:absolute;left:0;top:-15px;font-size:10px;letter-spacing:.25em;color:var(--dim);font-style:normal;text-transform:uppercase}
#b-hp{height:11px}#b-hp i{background:linear-gradient(#c8463a,#8e241d)}#b-san i{background:linear-gradient(#a9b9dd,#6a7fae)}#b-st{height:4px;margin-top:6px}#b-st i{background:var(--stam)}
#vit .bar{margin-top:20px}#vit #b-st{margin-top:6px}
#status{display:flex;gap:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;min-height:14px;margin-bottom:2px}
#status span{color:var(--blood)}
#br{position:absolute;right:22px;bottom:20px;text-align:right;width:260px}
#wname{font-size:14px;letter-spacing:.06em}#ammo{font-size:26px;line-height:1.1;margin-top:2px}#ammo small{font-size:14px;color:var(--dim)}
#b-oil{margin-top:20px}#b-oil i{background:linear-gradient(90deg,#8a5f22,var(--oil))}#b-oil em{left:auto;right:0}
#slots{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px}
.slot{width:46px;height:46px;border:1px solid var(--line);background:rgba(0,0,0,.5);position:relative;display:flex;align-items:center;justify-content:center}
.slot svg{width:22px;height:22px;fill:var(--bone);opacity:.9}.slot.empty svg{opacity:.2}.slot.empty .cnt{color:var(--faint)}
.slot .key{position:absolute;left:3px;top:1px;font-size:10px;color:var(--dim)}.slot .cnt{position:absolute;right:4px;bottom:1px;font-size:12px}
#prompt{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);font-size:15px;white-space:nowrap;text-align:center;opacity:0;transition:opacity .15s}
#prompt.on{opacity:1}#prompt kbd,.kbd{display:inline-block;border:1px solid var(--bone);padding:0 6px;margin-right:8px;font-family:inherit;font-size:12px;line-height:18px;min-width:20px;text-align:center}
#prompt small{display:block;color:var(--dim);font-size:12px;margin-top:3px;white-space:pre-line}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(233,201,138,.75);box-shadow:0 0 4px #000}
#cross.use{width:10px;height:10px;margin:-5px;background:none;border:1.5px solid var(--lamp)}#cross.focus{width:16px;height:16px;margin:-8px;background:none;border:1px solid rgba(233,201,138,.5)}
#mini{position:absolute;right:20px;top:16px;width:150px;height:150px;border:1px solid var(--line);background:rgba(0,0,0,.45);border-radius:50%;overflow:hidden}
#mini canvas{width:150px;height:150px}
#eye{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:54px;height:26px;opacity:0;transition:opacity .2s}
#eye svg{width:100%;height:100%;overflow:visible}
#toasts{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;width:70vw}
.toast{font-size:14px;padding:3px 14px;background:rgba(0,0,0,.45);border-left:2px solid var(--line);animation:tin .25s;max-width:100%;text-align:center}
.toast.relic{color:var(--lamp);border-color:var(--lamp)}.toast.curse{color:#e0685a;border-color:var(--blood)}.toast.warn{color:#e0a45a;border-color:#e0a45a}.toast.teeth{color:var(--bone)}.toast.whisper{font-style:italic;color:#9aa3bf;background:none;border:none;letter-spacing:.2em}
.toast.out{opacity:0;transition:opacity .6s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#hint{position:absolute;left:50%;top:118px;transform:translateX(-50%);max-width:560px;padding:10px 20px;background:rgba(6,7,8,.82);border:1px solid var(--line);border-top:1px solid var(--lamp2);font-size:14px;line-height:1.5;text-align:center;opacity:0;transition:opacity .5s}
#hint.on{opacity:1}#hint b{color:var(--lamp);font-weight:normal}
#caps{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:system-ui,sans-serif;font-size:13px}
.cap{background:rgba(0,0,0,.72);padding:2px 10px;color:#ddd}
#boss{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:min(560px,60vw);text-align:center}
#boss .nm{font-size:15px;letter-spacing:.35em;text-transform:uppercase;color:var(--bone)}#boss .bar{height:7px;margin-top:6px}#boss .bar i{background:linear-gradient(#b0352b,#6e1812)}#boss .sh i{background:#8c6ad0}#boss .sh{height:3px;margin-top:3px}#boss .tip{font-size:12px;color:#b9a3ea;margin-top:7px;letter-spacing:.08em}#boss .tip .kbd{border-color:#b9a3ea;margin:0 0 0 6px}
#hurt{position:absolute;inset:0}
.hd{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px;border-radius:50%;border:5px solid transparent;border-top-color:rgba(200,50,40,.85);filter:blur(1.5px)}
#dmg{position:absolute;inset:0;overflow:hidden}
.dn{position:absolute;font-size:15px;color:#e8e2d0;animation:dn .8s ease-out forwards;font-family:'Courier New',monospace;font-weight:700}
.dn.crit{color:var(--lamp);font-size:21px}
@keyframes dn{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-38px);opacity:0}}
#card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.2s;text-align:center;text-shadow:0 2px 12px #000}
#card.on{opacity:1}#card .c1{font-size:13px;letter-spacing:.6em;color:var(--dim);text-transform:uppercase}#card .c2{font-size:46px;letter-spacing:.22em;margin:10px 0;text-transform:uppercase;font-weight:normal}#card .c3{font-style:italic;color:var(--lamp)}
/* ------------------------------------------------------------- overlays */
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.93));z-index:10;overflow:auto;cursor:default}
#ov.clear{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.15),rgba(0,0,0,.82))}
#ov.black{background:#000}
.panel{background:var(--panel);border:1px solid var(--line);padding:30px 38px;max-width:min(1040px,94vw);max-height:92vh;overflow:auto;position:relative;animation:pin .3s}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.panel:before,.panel:after{content:'';position:absolute;width:14px;height:14px;border:1px solid var(--lamp2)}.panel:before{left:-1px;top:-1px;border-right:none;border-bottom:none}.panel:after{right:-1px;bottom:-1px;border-left:none;border-top:none}
h2{font-weight:normal;font-size:24px;letter-spacing:.28em;text-transform:uppercase;margin:0 0 4px;color:var(--bone)}
h3{font-weight:normal;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.lead{color:var(--dim);font-style:italic;margin:0 0 18px;font-size:14px}
.btn{display:block;background:none;border:none;color:var(--bone);font-family:inherit;font-size:17px;letter-spacing:.22em;text-transform:uppercase;padding:9px 16px;cursor:pointer;text-align:center;transition:color .15s,letter-spacing .2s;position:relative;margin:0 auto}
.btn:hover,.btn:focus-visible{color:var(--lamp);letter-spacing:.3em;outline:none}.btn small{display:block;font-size:11px;letter-spacing:.15em;color:var(--dim);text-transform:none;font-style:italic}
.btn.sm{font-size:13px;padding:6px 12px;display:inline-block;border:1px solid var(--line)}.btn.sm:hover{border-color:var(--lamp2);letter-spacing:.22em}
.btn[disabled]{color:var(--faint);cursor:default;letter-spacing:.22em}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}.row.left{justify-content:flex-start}
.title{text-align:center;padding:20px}
.title .pre{font-size:11px;letter-spacing:.7em;color:var(--dim)}
.title h1{font-weight:normal;font-size:clamp(46px,9vw,112px);letter-spacing:.2em;margin:14px 0 0;line-height:.95;color:#e6dfcb;text-shadow:0 0 40px rgba(233,201,138,.25),0 4px 30px #000}
.title h1 span{display:block;letter-spacing:.5em;font-size:.56em;color:var(--lamp);margin-left:.5em}
.title .sub{font-style:italic;color:var(--dim);margin:18px 0 36px;letter-spacing:.12em}
.title .foot{margin-top:38px;font-size:12px;color:var(--faint);letter-spacing:.18em}
.cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.cardb{width:230px;min-height:170px;border:1px solid var(--line);background:rgba(18,18,17,.9);padding:18px 16px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:center;position:relative}
.cardb:hover,.cardb.sel{border-color:var(--lamp);transform:translateY(-4px);box-shadow:0 8px 30px rgba(233,201,138,.12)}
.cardb.locked{opacity:.55}.cardb.cursed{border-color:rgba(176,53,43,.5)}
.cardb .nm{font-size:17px;letter-spacing:.1em;color:var(--lamp);margin-bottom:8px}.cardb .ds{font-size:13.5px;line-height:1.45;color:var(--bone)}.cardb .tg{position:absolute;left:0;right:0;bottom:10px;font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.cardb .st{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}.grid3{display:grid;grid-template-columns:1fr 1.15fr 1.15fr;gap:0 30px;min-width:min(900px,88vw)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:2px 0;gap:14px}.kv span:last-child{color:var(--lamp)}
.item{padding:7px 0;border-bottom:1px solid rgba(211,204,184,.07);font-size:14px;line-height:1.4}.item .nm{color:var(--lamp)}.item .ds{color:var(--dim);font-size:13px}
.item.row2{display:flex;justify-content:space-between;align-items:center;gap:16px}
.pips{letter-spacing:3px;color:var(--lamp2)}
.attr{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:15px}.attr b{font-weight:normal;color:var(--lamp);font-size:18px;width:28px;text-align:center}
.plus{width:22px;height:22px;border:1px solid var(--lamp2);background:none;color:var(--lamp);cursor:pointer;font-size:14px;line-height:1;padding:0}.plus:hover{background:rgba(233,201,138,.15)}
.set{display:grid;grid-template-columns:200px 1fr 54px;gap:8px 16px;align-items:center;font-size:14px;min-width:min(560px,84vw)}
input[type=range]{-webkit-appearance:none;appearance:none;height:2px;background:var(--faint);outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--lamp);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--lamp);cursor:pointer;border:none}
input[type=text]{background:rgba(0,0,0,.5);border:1px solid var(--line);color:var(--bone);font-family:'Courier New',monospace;padding:6px 10px;font-size:14px;letter-spacing:.2em;text-transform:uppercase;width:170px;outline:none;text-align:center}
input[type=text]:focus{border-color:var(--lamp2)}
.tog{cursor:pointer;color:var(--lamp);border:1px solid var(--line);padding:3px 12px;font-size:13px;letter-spacing:.15em;text-align:center;background:none;font-family:inherit}.tog:hover{border-color:var(--lamp2)}
.note{max-width:560px;font-size:16px;line-height:1.75;white-space:pre-line;color:#ddd5bd}.note h2{font-size:17px;color:var(--lamp);margin-bottom:16px}
.crawl{max-width:640px;text-align:center;font-size:20px;line-height:1.9;font-style:italic;color:#cfc8b4}.crawl p{opacity:0;animation:cr 2.4s forwards;margin:14px 0}.crawl p:nth-child(2){animation-delay:2.2s}.crawl p:nth-child(3){animation-delay:4.6s}.crawl p:nth-child(4){animation-delay:7s;color:var(--lamp);font-style:normal;letter-spacing:.3em;font-size:15px;text-transform:uppercase}
@keyframes cr{to{opacity:1}}
.skip{position:fixed;right:26px;bottom:20px;font-size:12px;letter-spacing:.3em;color:var(--faint)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 26px;margin:18px 0;text-align:center}.stats div b{display:block;font-weight:normal;font-size:24px;color:var(--lamp)}.stats div{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tab{cursor:pointer;padding:5px 16px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid transparent}.tab.on,.tab:hover{color:var(--lamp);border-color:var(--lamp2)}
.scroll{max-height:56vh;overflow:auto;padding-right:10px}
.scroll::-webkit-scrollbar,.panel::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb{background:var(--faint)}
.ctl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 14px;font-size:13px;color:var(--dim)}.ctl b{color:var(--bone);font-weight:normal;text-align:right}
#load{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;transition:opacity .8s}
#load .t{letter-spacing:.6em;font-size:13px;color:var(--dim);text-transform:uppercase}#load .b{width:220px;height:1px;background:#222;margin-top:18px}#load .b i{display:block;height:1px;background:var(--lamp);width:0}
#fatal{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.7}
#mapc{background:rgba(0,0,0,.4);border:1px solid var(--line);display:block}
.legend{font-size:12px;color:var(--dim);display:flex;gap:18px;justify-content:center;margin-top:10px;flex-wrap:wrap}.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
@media (max-width:820px){.grid3{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}#mini{display:none}}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#d3ccb8;font-family:Georgia,serif;text-align:center;padding:30px">Sunken Vigil needs JavaScript and WebGL 2 to run.</div></noscript>
<div id="hud" class="hidden">
  <div id="xp"></div>
  <div id="tl"><div id="floorname"></div><div id="objective"></div><div id="purse"></div></div>
  <div id="mini"><canvas width="150" height="150"></canvas></div>
  <div id="eye"><svg viewBox="0 0 54 26"><path id="eyeL" d="M2 13 Q27 -6 52 13 Q27 32 2 13Z" fill="none" stroke="#e9c98a" stroke-width="1.5"/><circle id="eyeP" cx="27" cy="13" r="5" fill="#e9c98a"/></svg></div>
  <div id="boss" class="hidden"><div class="nm"></div><div class="bar"><b></b><i></i></div><div class="bar sh hidden"><i></i></div><div class="tip hidden">Shrouded — hold the focused beam on her <span class="kbd">Right mouse</span></div></div>
  <div id="hint"></div>
  <div id="hurt"></div>
  <div id="dmg"></div>
  <div id="cross"></div>
  <div id="caps"></div>
  <div id="toasts"></div>
  <div id="prompt"></div>
  <div id="vit"><div id="status"></div>
    <div class="bar" id="b-hp"><em>Health</em><b></b><i></i><span class="num"></span></div>
    <div class="bar" id="b-san"><em>Sanity</em><b></b><i></i><span class="num"></span></div>
    <div class="bar" id="b-st"><i></i></div></div>
  <div id="slots"></div>
  <div id="br"><div id="wname"></div><div id="ammo" class="num"></div><div class="bar" id="b-oil"><em>Lamp oil</em><i></i></div></div>
</div>
<div id="card"><div class="c1"></div><div class="c2"></div><div class="c3"></div></div>
<div id="ov" class="hidden"></div>
<div id="load"><div class="t">Trimming the wick</div><div class="b"><i></i></div></div>
<div id="fatal" class="hidden"></div>
<script>
(function(){
'use strict';
// ---- 00_core.js ----
// ============================================================================
//  SUNKEN VIGIL — core utilities, math, input, storage
// ============================================================================
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const sat = v => v < 0 ? 0 : (v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; else if (d < -PI) d += TAU; return d; };
const hyp = Math.hypot;
const now = () => performance.now() / 1000;

function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
// Seeded PRNG (mulberry32) with helpers
function RNG(seed) {
  let a = seed >>> 0;
  const f = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
  f.weighted = (arr, wf) => { let tot = 0; for (const x of arr) tot += wf(x); let r = f() * tot; for (const x of arr) { r -= wf(x); if (r <= 0) return x; } return arr[arr.length - 1]; };
  return f;
}
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndPick = arr => arr[Math.floor(Math.random() * arr.length)];
const seedToStr = n => (n >>> 0).toString(36).toUpperCase().padStart(6, '0');

// ---------------------------------------------------------------- mat4 -----
const M4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  ident(m) { m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  copy(o, a) { o.set(a); return o; },
  mul(o, a, b) {
    const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3], a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7],
      a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11], a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
    for (let i = 0; i < 4; i++) {
      const b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
      o[i * 4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
      o[i * 4 + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
      o[i * 4 + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
      o[i * 4 + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
    }
    return o;
  },
  persp(o, fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy / 2); o.fill(0);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o;
  },
  // view matrix for a camera at (x,y,z) with yaw (0 = -Z, +yaw turns right), pitch (+ up), roll
  view(o, x, y, z, yaw, pitch, roll) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const fx = sy * cp, fy = sp, fz = -cy * cp;
    let rx = cy, ry = 0, rz = sy;
    let ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
    if (roll) { const c = Math.cos(roll), s = Math.sin(roll); const nrx = rx * c + ux * s, nry = ry * c + uy * s, nrz = rz * c + uz * s; ux = -rx * s + ux * c; uy = -ry * s + uy * c; uz = -rz * s + uz * c; rx = nrx; ry = nry; rz = nrz; }
    o[0] = rx; o[4] = ry; o[8] = rz; o[12] = -(rx * x + ry * y + rz * z);
    o[1] = ux; o[5] = uy; o[9] = uz; o[13] = -(ux * x + uy * y + uz * z);
    o[2] = -fx; o[6] = -fy; o[10] = -fz; o[14] = fx * x + fy * y + fz * z;
    o[3] = 0; o[7] = 0; o[11] = 0; o[15] = 1; return o;
  },
  // o = parent * T(t) * Ry * Rx * Rz   (parent may be null)
  trs(o, parent, tx, ty, tz, rx, ry, rz) {
    const cx = Math.cos(rx || 0), sx = Math.sin(rx || 0), cy = Math.cos(ry || 0), sy = Math.sin(ry || 0), cz = Math.cos(rz || 0), sz = Math.sin(rz || 0);
    const L = M4._t;
    L[0] = cy * cz + sy * sx * sz; L[1] = cx * sz; L[2] = -sy * cz + cy * sx * sz; L[3] = 0;
    L[4] = -cy * sz + sy * sx * cz; L[5] = cx * cz; L[6] = sy * sz + cy * sx * cz; L[7] = 0;
    L[8] = sy * cx; L[9] = -sx; L[10] = cy * cx; L[11] = 0;
    L[12] = tx; L[13] = ty; L[14] = tz; L[15] = 1;
    if (parent) M4.mul(o, parent, L); else o.set(L);
    return o;
  },
  // o = m * S
  scale(o, m, sx, sy, sz) {
    o[0] = m[0] * sx; o[1] = m[1] * sx; o[2] = m[2] * sx; o[3] = m[3] * sx;
    o[4] = m[4] * sy; o[5] = m[5] * sy; o[6] = m[6] * sy; o[7] = m[7] * sy;
    o[8] = m[8] * sz; o[9] = m[9] * sz; o[10] = m[10] * sz; o[11] = m[11] * sz;
    o[12] = m[12]; o[13] = m[13]; o[14] = m[14]; o[15] = m[15]; return o;
  },
  // o = m * T
  translate(o, m, x, y, z) {
    const a = m[12] + m[0] * x + m[4] * y + m[8] * z, b = m[13] + m[1] * x + m[5] * y + m[9] * z, c = m[14] + m[2] * x + m[6] * y + m[10] * z;
    if (o !== m) o.set(m); o[12] = a; o[13] = b; o[14] = c; return o;
  },
  // look-at view matrix
  lookAt(o, ex, ey, ez, tx, ty, tz) {
    let fx = tx - ex, fy = ty - ey, fz = tz - ez; let l = 1 / (hyp(fx, fy, fz) || 1); fx *= l; fy *= l; fz *= l;
    let ux = 0, uy = 1, uz = 0; if (Math.abs(fy) > 0.999) { ux = 0; uy = 0; uz = 1; }
    let rx = fy * uz - fz * uy, ry = fz * ux - fx * uz, rz = fx * uy - fy * ux; l = 1 / (hyp(rx, ry, rz) || 1); rx *= l; ry *= l; rz *= l;
    ux = ry * fz - rz * fy; uy = rz * fx - rx * fz; uz = rx * fy - ry * fx;
    o[0] = rx; o[4] = ry; o[8] = rz; o[12] = -(rx * ex + ry * ey + rz * ez);
    o[1] = ux; o[5] = uy; o[9] = uz; o[13] = -(ux * ex + uy * ey + uz * ez);
    o[2] = -fx; o[6] = -fy; o[10] = -fz; o[14] = fx * ex + fy * ey + fz * ez;
    o[3] = 0; o[7] = 0; o[11] = 0; o[15] = 1; return o;
  },
  _t: new Float32Array(16)
};

// -------------------------------------------------------------- storage ----
// localStorage with an in-memory fallback (sandboxed previews may refuse storage)
const Store = {
  mem: {}, prefix: 'sunkenvigil.',
  get(k, def) {
    try { const v = window.localStorage.getItem(this.prefix + k); if (v != null) return JSON.parse(v); } catch (e) { /* ignore */ }
    return (k in this.mem) ? JSON.parse(this.mem[k]) : def;
  },
  set(k, v) {
    const s = JSON.stringify(v); this.mem[k] = s;
    try { window.localStorage.setItem(this.prefix + k, s); } catch (e) { /* ignore */ }
  },
  del(k) { delete this.mem[k]; try { window.localStorage.removeItem(this.prefix + k); } catch (e) { /* ignore */ } }
};

  sens: 1.0, invertY: false, fov: 92, master: 0.8, music: 0.7, sfx: 0.9, quality: 1, retro: 1,
  bob: true, shake: 1, captions: false, reduceFlash: false, gamma: 1.0, minimap: true, hints: true, dmg: true
};

// ---------------------------------------------------------------- input ----
const Input = {
  keys: Object.create(null), pressed: Object.create(null), mdx: 0, mdy: 0, btn: [0, 0, 0], btnP: [0, 0, 0], btnR: [0, 0, 0],
  wheel: 0, mx: 0.5, my: 0.5, locked: false, lockSupported: true, wantLock: false, canvas: null, onLockLost: null, onAnyKey: null,
  init(canvas) {
    this.canvas = canvas;
    const gameKeys = { Tab: 1, Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, KeyF: 0, Slash: 1 };
    window.addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (gameKeys[e.code]) e.preventDefault();
      if (!e.repeat) { this.keys[e.code] = 1; this.pressed[e.code] = 1; if (this.onAnyKey) this.onAnyKey(e.code); }
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = 0; });
    window.addEventListener('blur', () => { this.keys = Object.create(null); this.btn = [0, 0, 0]; });
    document.addEventListener('mousemove', e => {
      this.mx = e.clientX / Math.max(1, window.innerWidth); this.my = e.clientY / Math.max(1, window.innerHeight);
      if (this.locked) { this.mdx += e.movementX || 0; this.mdy += e.movementY || 0; }
      else if (!this.lockSupported && this.wantLock && (e.buttons & 4 || this.freeLook)) { this.mdx += e.movementX || 0; this.mdy += e.movementY || 0; }
    });
    canvas.addEventListener('mousedown', e => { e.preventDefault(); if (this.wantLock && !this.locked && this.lockSupported) { this.lock(); if (!this.freeLook) return; } if (e.button < 3) { this.btn[e.button] = 1; this.btnP[e.button] = 1; } });
    window.addEventListener('mouseup', e => { if (e.button < 3) { if (this.btn[e.button]) this.btnR[e.button] = 1; this.btn[e.button] = 0; } });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('wheel', e => { this.wheel += Math.sign(e.deltaY); }, { passive: true });
    document.addEventListener('pointerlockchange', () => {
      const was = this.locked; this.locked = document.pointerLockElement === canvas; if (this.locked) this.lockFails = 0;
      if (was && !this.locked && this.onLockLost) this.onLockLost();
    });
    document.addEventListener('pointerlockerror', () => this.lockFailed());
  },
  lock() {
    if (this.locked || !this.canvas.requestPointerLock) { if (!this.canvas.requestPointerLock) { this.lockSupported = false; this.freeLook = true; } return; }
    try { const p = this.canvas.requestPointerLock(); if (p && p.catch) p.catch(() => this.lockFailed()); }
    catch (e) { this.lockSupported = false; this.freeLook = true; }
  },
  // a refused lock can be transient (too soon after Esc) or permanent (sandboxed frame): fall back to free look after repeated refusals
  lockFailed() { const t = performance.now(); if (t - (this._lf || 0) < 50) return; this._lf = t; this.lockFails = (this.lockFails || 0) + 1; if (this.lockFails >= 3) { this.lockSupported = false; this.freeLook = true; } },
  unlock() { if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (e) { /* ignore */ } } },
  down(c) { return !!this.keys[c]; },
  hit(c) { return !!this.pressed[c]; },
  endFrame() { this.pressed = Object.create(null); this.mdx = 0; this.mdy = 0; this.btnP[0] = this.btnP[1] = this.btnP[2] = 0; this.btnR[0] = this.btnR[1] = this.btnR[2] = 0; this.wheel = 0; }
};

//  Procedural audio — every sound in the game is synthesised at runtime
// ============================================================================
const Sfx = (() => {
  let ctx = null, master, comp, sfxBus, musBus, ambBus, revIn, nbuf, bbuf;
  let drone = null, pad = null, siren = null, air = null;
  const S = { ready: false, onCaption: null, lx: 0, ly: 0, lz: 0, theme: -1 };
  const capT = Object.create(null);
  let stepT = 0, stepI = 0, hbT = 0, evT = 6, lulT = 0, lulI = 0, whT = 8;

  const G = (v, dest) => { const g = ctx.createGain(); g.gain.value = v; if (dest) g.connect(dest); return g; };
  const F = (type, f, q, dest) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q == null ? 0.7 : q; if (dest) b.connect(dest); return b; };
  function T(out, t, type, f0, f1, dur, vol, a) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    a = a || 0.005; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function N(out, t, dur, vol, ftype, f0, f1, q, a, brown) {
    const s = ctx.createBufferSource(); s.buffer = brown ? bbuf : nbuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = ftype || 'lowpass'; fl.Q.value = q == null ? 0.8 : q;
    fl.frequency.setValueAtTime(f0, t); if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ctx.createGain(); a = a || 0.004; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05); return fl;
  }
  // tone with vibrato / tremolo, run through a formant filter — used for voices
  function V(out, t, type, f0, f1, dur, vol, a, vibRate, vibDepth, form, q) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    if (vibRate) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = vibRate; lg.gain.value = vibDepth; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.05); }
    a = a || 0.01; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (form) { const fl = F('bandpass', form, q || 3); o.connect(fl); fl.connect(g); const dry = G(0.25, g); o.connect(dry); } else o.connect(g);
    g.connect(out); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function bell(out, t, f, vol, dur, detune) {
    const parts = [1, 2.0, 2.76, 4.07, 5.43], amps = [1, 0.5, 0.32, 0.18, 0.1];
    for (let i = 0; i < parts.length; i++) T(out, t, 'sine', f * parts[i] * (1 + (detune || 0) * i), 0, dur / (1 + i * 0.5), vol * amps[i], 0.003);
  }
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  // ------------------------------------------------------------ recipes ----
  const R = {
    step(o, t, p) { N(o, t, 0.09, 0.5, 'lowpass', 520 * p, 180, 0.9); T(o, t, 'sine', 78 * p, 46, 0.07, 0.35); },
    stepWet(o, t, p) { N(o, t, 0.09, 0.4, 'lowpass', 520 * p, 180); N(o, t + 0.01, 0.07, 0.22, 'bandpass', 2300 * p, 1200, 2); T(o, t, 'sine', 70, 44, 0.07, 0.3); },
    stepHeavy(o, t, p) { N(o, t, 0.25, 0.9, 'lowpass', 260, 60, 0.9); T(o, t, 'sine', 52 * p, 28, 0.3, 1.0); },
    swing(o, t, p) { N(o, t, 0.2, 0.45, 'bandpass', 500 * p, 1900 * p, 1.4, 0.06); },
    swingHeavy(o, t, p) { N(o, t, 0.32, 0.6, 'bandpass', 260 * p, 1300 * p, 1.2, 0.1); },
    hitFlesh(o, t, p) { N(o, t, 0.13, 0.9, 'lowpass', 1100 * p, 200); T(o, t, 'sine', 120 * p, 48, 0.14, 0.9); N(o, t, 0.03, 0.4, 'bandpass', 2400, 1800, 2); },
    hitHard(o, t, p) { N(o, t, 0.06, 0.7, 'highpass', 1400, 2400); T(o, t, 'triangle', 620 * p, 300, 0.09, 0.4); T(o, t, 'sine', 170, 80, 0.09, 0.6); },
    hitMetal(o, t, p) { bell(o, t, 540 * p, 0.3, 0.5, 0.013); N(o, t, 0.04, 0.5, 'highpass', 2500, 3500); },
    crit(o, t, p) { N(o, t, 0.16, 1.0, 'lowpass', 1600, 180); T(o, t, 'sine', 150, 40, 0.2, 1.0); N(o, t, 0.05, 0.5, 'bandpass', 3200, 2000, 3); },

    shotgun(o, t, p) { N(o, t, 0.55, 1.9, 'lowpass', 2600, 160, 0.6, 0.001); T(o, t, 'sine', 120, 30, 0.34, 1.7, 0.001); N(o, t, 0.03, 1.0, 'highpass', 2500, 4000, 0.7, 0.001); },
    dry(o, t) { T(o, t, 'square', 1900, 900, 0.02, 0.25, 0.001); N(o, t, 0.02, 0.3, 'highpass', 3000, 3000); },

    lightOn(o, t) { T(o, t, 'square', 2400, 1400, 0.018, 0.2, 0.001); N(o, t, 0.02, 0.2, 'highpass', 4000, 4000); },

function buildLevelMesh(L, mb) {

// ============================================================================
//  Game logic — runs, floors, interaction, loot, hazards, the director
// ============================================================================
Object.assign(Game, {
  timers: [], after(sec, fn) { this.timers.push({ t: sec, fn }); },
  picks: [], phantoms: [], flashes: [], boss: null, inter: null, watch: 0, muzzle: 0, lampFlick: 1, lvT: 0, stalker: null, dir: null, deadT: 0, titleYaw: 0,

  // ------------------------------------------------------------- meta ------
  loadMeta() { const d = { echoes: 0, up: {}, vocs: { orderly: 1 }, runs: 0, wins: 0, best: 0, vigilMax: 0, lore: {}, bestiary: {}, kills: {}, seenRelics: {}, hints: {}, corpse: null, count: 6, trueEnd: 0 }; this.meta = Object.assign(d, Store.get('meta', {})); },
  saveMeta() { Store.set('meta', this.meta); },
  saveRun() { const P = this.P; Store.set('run', { run: this.run, p: { attrs: P.attrs, perks: P.perks, relics: P.relics, curses: P.curses, level: P.level, xp: P.xp, points: P.points, pending: P.pending, teeth: P.teeth, melee: P.melee, gun: P.gun, wsel: P.wsel, mag: P.mag, ammo: P.ammo, cons: P.cons, hp: P.hp, san: P.san, battery: P.battery, stats: P.stats, vault: P.keys.vault } }); },

  // ------------------------------------------------------------- runs ------
  newRun(vocId, seedStr, vigil) {
    Sfx.init(); const m = this.meta, voc = VOCATIONS.find(v => v.id === vocId) || VOCATIONS[0];
    const seed = seedStr || seedToStr((Math.random() * 4294967296) >>> 0); m.count++; m.runs++;
    this.run = { seed, floor: 1, vigil: vigil || 0, voc: voc.id, no: m.count, rerolls: 1 + (m.up.insight || 0), boons: null, banished: 0 };
    this.P = new Player(voc, m);
    if (m.up.heirloom) { const id = Items.rollRelic(RNG(hashStr(seed + 'heir')), this.P.relics, false); if (id) { this.P.addRelic(id); m.seenRelics[id] = 1; } }
    this.saveMeta(); this.state = 'intro'; UI.showHUD(false);
    UI.intro(m.count, () => this.enterFloor(1));
  },
  continueRun() {
    Sfx.init(); const sv = Store.get('run', null); if (!sv) return; const voc = VOCATIONS.find(v => v.id === sv.run.voc) || VOCATIONS[0];
    this.run = sv.run; this.run.boons = null; const P = this.P = new Player(voc, this.meta), s = sv.p;
    P.attrs = s.attrs; P.perks = s.perks; P.relics = s.relics; P.curses = s.curses || []; P.level = s.level; P.xp = s.xp; P.points = s.points; P.pending = s.pending || 0; P.teeth = s.teeth; P.melee = s.melee; P.gun = s.gun; P.wsel = s.gun ? s.wsel : 'melee'; P.mag = s.mag; P.ammo = s.ammo; P.cons = s.cons; P.stats = s.stats; P.keys.vault = s.vault || 0;
    P.recalc(); P.hp = Math.min(s.hp, P.st.maxHp); P.san = Math.min(s.san, P.st.maxSan); P.battery = s.battery;
    this.enterFloor(this.run.floor);
  },
  enterFloor(n) {
    const m = this.meta, R = this.run, P = this.P; R.floor = n; this.state = 'load';
    const notes = LORE.map((l, i) => i).filter(i => !m.lore[i]);
    const L = this.L = genLevel(n, R.seed, { notes, corpse: m.corpse && m.corpse.seed !== R.seed + ':' + R.no ? m.corpse : null, vigil: R.vigil });
    Gfx.setStatic(L.mesh.chunks, L.mesh.decals); L.mesh = null;
    this.enemies = []; this.projs = []; this.areas = []; this.flares = []; this.picks = []; this.phantoms = []; this.flashes = []; this.timers = []; this.boss = null; this.inter = null;
    for (const s of L.spawns) this.spawnEnemy(s.type, s.x, s.z, s);
    const lr = RNG(hashStr(R.seed + 'loot' + n));
    for (const p of L.picks) { if (p.kind === 'note') this.picks.push({ x: p.x, y: 0.05, z: p.z, vy: 0, d: { t: 'note', i: p.note }, t: 9 }); else for (const d of Items.rollLoot(RNG(p.seed), 'loose', n, P)) this.picks.push({ x: p.x, y: 0.18, z: p.z, vy: 0, d, t: 9 }); }
    P.x = L.spawn.x; P.z = L.spawn.z; P.yaw = P.lampYaw = L.spawn.yaw; P.pitch = 0; P.vx = P.vz = 0; P.keys.exit = false; P.cheated = 0; P.dead = false; P.swing = null; P.charge = -1;
    this.floorTime = 0; this.tension = 0; this.chase = 0; this.dread = 0; this.lvT = 0;
    this.stalker = { t: Math.max(100, 285 - n * 12 - R.vigil * 18 + P.st.stalkerDelay), ent: null, warned: false, on: !L.isBoss };
    this.dir = { scareT: rnd(28, 50), halT: rnd(8, 16), last: '', eyeT: 0, zero: 0 };
    L.reveal(P.x, P.z, 3); this.saveRun();
    this.state = 'play'; UI.close(); UI.showHUD(true); Input.wantLock = true; Input.lock();
    this.fx.fade = 1; this.fx.fadeTo = 0; this.fx.lid = 1; this.fx.red = 0; this.fx.white = 0; this.fx.warp = 0; this.fx.bars = 0;
    UI.card('Floor ' + n + (R.vigil ? '  ·  Vigil ' + R.vigil : ''), L.theme.name, L.theme.sub, 4.2);
    Sfx.play(n === 1 ? 'riser' : 'gate', { vol: 0.5 });
    if (n === 1) { UI.hint('move', '<b>W A S D</b> to move · <b>Shift</b> to sprint · <b>C</b> to crouch and move quietly · <b>Space</b> to dodge'); UI.hint('lamp', '<b>F</b> toggles your lamp. The dark eats at your sanity — but the things down here find you by your light.'); UI.hint('fight', '<b>Left mouse</b> to strike, hold it for a heavy blow. <b>Right mouse</b> focuses the beam: it burns some things and staggers others.'); UI.hint('goal', 'Find the <b>Descent Key</b>, then the gate. Do not linger — something else walks these floors, and it is counting.'); }
    if (n === 3) UI.hint('und', 'The Undercroft. Shades live here: watch for your lamp flickering, and keep oil in reserve.');
    if (L.isBoss) UI.hint('bossf', 'A votive flame burns here. Take what it offers before you open the door.');
  },
  nextFloor() {
    const R = this.run; this.P.stats.floors++; this.meta.best = Math.max(this.meta.best, R.floor); this.state = 'trans'; this.fx.fadeTo = 1; Sfx.play('gate'); Input.wantLock = true;
    this.after(1.5, () => { if (this.state === 'trans') { this.P.heal(this.P.st.maxHp * 0.15); this.enterFloor(R.floor + 1); } });
  },
  echoes(win) {
    const P = this.P, R = this.run, lines = [['Floors descended', P.stats.floors * 9], ['Things put to rest', Math.round(P.stats.kills * 0.6 + P.stats.elite * 4)], ['Experience', P.level * 2], ['Writings recovered', P.stats.notes * 4]];
    if (win) lines.push(['The Matron', 70]); if (win === 'out') lines.push(['The vigil kept', 40]);
    let total = lines.reduce((a, l) => a + l[1], 0); if (R.vigil) { const b = Math.round(total * R.vigil * 0.25); lines.push(['Vigil ' + R.vigil, b]); total += b; }
    return { lines: lines.filter(l => l[1] > 0), total };
